# Lagrange Station — Rust workspace manifest (Todo 1 bootstrap).
# Pins: Rust 1.97.1 via rust-toolchain.toml; edition 2024; resolver 3.
# Approved dependency lines (draft 2026-08-04 line 40) are consumed by later
# todos and pinned by Cargo.lock when first referenced:
#   - Axum 0.8.x            (crates/auth, crates/risk-gateway, apps/api-server)
#   - SQLx 0.9.x            (crates/job-queue, crates/market-data, ...)
#   - Polars 0.54.x (RUST line only)  (crates/factor-engine, crates/selector;
#     the PYTHON polars pin was removed by ADR-0001 - PyPI has no 0.54.x release
#     and NT 1.231.0 provides pandas/pyarrow; see docs/decisions/)
# Skeleton crates intentionally have NO dependencies yet (Todo 1 is topology only).

[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/auth",
    "crates/market-data",
    "crates/factor-engine",
    "crates/selector",
    "crates/portfolio-model",
    "crates/job-queue",
    "crates/result-model",
    "crates/risk-gateway",
    "crates/kis-client",
    "crates/opendart-client",
    "crates/api-server",
    "apps/api-server/auth",
    "tests/integration/migration-contract",
    "data-pipelines/collectors",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

# Build-artifact size control.
#
# With the default `debug = 2`, ONE clean `cargo test --workspace` produced an
# 86.7GB `target/debug/deps`: every test binary statically links the polars
# stack (via selector -> factor-engine) with full DWARF. That filled the disk
# twice on 2026-08-08, and it does not announce itself as a disk problem — it
# surfaces as `link.exe failed: exit code 1318` and
# `rustc-LLVM ERROR: IO failure on output stream`, which read like toolchain
# faults.
#
# `line-tables-only` keeps what the test suites actually consume: panic
# messages and backtraces still carry file and line. What it drops is variable
# and type information, which only a step-debugger uses. Raise this back to 2
# temporarily if you need to attach a debugger.
[profile.dev]
debug = "line-tables-only"

# Test and dependency builds inherit dev; state it rather than relying on the
# inheritance being remembered, since these are the profiles that dominate.
[profile.test]
debug = "line-tables-only"

# Dependencies carry NO debug info.
#
# `line-tables-only` above shrank the binaries and did nothing to the PDBs,
# because on MSVC the .pdb is written whenever debug info is on at all. The
# result, measured on 2026-08-09: 59 GB of the 95 GB target directory was
# .pdb, and a single test binary linking polars wrote 790 MB of symbols while
# a proc-macro crate wrote 1 MB. The symbols are almost entirely polars and
# its tree, reached through selector -> factor-engine.
#
# Nobody steps through polars. What the suites consume is a backtrace naming
# a file and line in THIS workspace, and the members keep `line-tables-only`
# for exactly that -- only third-party code goes dark. Set this to 1 if you
# ever do need to see inside a dependency frame.
[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0

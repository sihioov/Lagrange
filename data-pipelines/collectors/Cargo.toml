[package]
name = "collectors"
description = "Lagrange Station data collectors: KRX raw ingestion CLI driving the market-data crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
market-data = { path = "../../crates/market-data" }
factor-engine = { path = "../../crates/factor-engine" }
domain = { path = "../../crates/domain" }
kis-client = { path = "../../crates/kis-client" }
opendart-client = { path = "../../crates/opendart-client" }
rustix = { version = "1.1", features = ["fs"] }
libc = "0.2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tempfile = "3"

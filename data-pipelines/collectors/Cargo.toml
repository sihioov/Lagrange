[package]
name = "collectors"
description = "Lagrange Station data collectors: KRX raw ingestion CLI driving the market-data crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
market-data = { path = "../../crates/market-data" }
domain = { path = "../../crates/domain" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"

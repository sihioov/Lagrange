# Lagrange Station — NautilusTrader uv project (Todo 1 bootstrap).
# Pins: NautilusTrader 1.231.0 (final 1.x official release; tested contract
# CPython 3.12 / Rust 1.97.1). No Python polars pin: ADR-0001 removed it because
# PyPI has no polars 0.54.x release and NT 1.231.0 provides its own data stack
# (pandas + pyarrow). Rust polars 0.54.x remains approved for crates/factor-engine
# and crates/selector (see docs/decisions/0001-python-polars-pin-correction.md).
# Layout: nt/strategies, nt/custom-data, nt/backtest-worker, nt/paper-runner,
# nt/live-node. Pins enforced by check-pins.* and uv.lock.

[project]
name = "lagrange-nt"
version = "0.1.0"
description = "Lagrange Station NautilusTrader workspace: strategies, custom-data, backtest-worker, paper-runner, live-node."
requires-python = ">=3.12"
dependencies = [
    "nautilus_trader==1.231.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "pytest>=8,<9",
]

[tool.uv]
package = false

[package]
name = "api-server-auth"
description = "Lagrange Station Axum auth router: mounts the crates/auth OIDC/session authority as HTTP routes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
auth = { path = "../../../crates/auth" }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
async-trait = "0.1"
chrono = "0.4"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[package]
name = "api-server-auth"
description = "Lagrange Station Axum auth router: mounts the crates/auth OIDC/session authority as HTTP routes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
auth = { path = "../../../crates/auth" }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

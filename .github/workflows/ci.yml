        id: cargo-download-restore
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ steps.cargo-cache-keys.outputs.download_key }}
          restore-keys: ${{ steps.cargo-cache-keys.outputs.download_prefix }}
      - name: Restore job-private Cargo build output
        id: cargo-target-restore
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/lagrange-cargo-target-postgres
          key: ${{ steps.cargo-cache-keys.outputs.target_key }}
          restore-keys: ${{ steps.cargo-cache-keys.outputs.target_prefix }}
      - name: Preflight PostgreSQL integration prerequisites
        run: python3 scripts/qa/dev-check.py preflight --profile db --stage integration --environment ci
      - id: postgres-validation
        name: Validate PostgreSQL migrations and serving-role boundaries
        run: |
          python3 - <<'PAPER_JOB_DEADLINE'
          import os
          import time
          from pathlib import Path

          def worker_deadline(start_ticks, ticks_per_second, boot_after, monotonic):
              if not (type(start_ticks) is int and start_ticks > 0 and ticks_per_second > 0):
                  raise ValueError("PAPER_FIXTURE_JOB_DEADLINE_UNAVAILABLE")
              start = start_ticks * 1_000_000_000 // ticks_per_second
              if not 0 <= start <= boot_after:
                  raise ValueError("PAPER_FIXTURE_JOB_DEADLINE_UNAVAILABLE")
              # Runner.Worker is created for this job before receiving its job message.
              # Its kernel start is a conservative budget origin; elapsed setup/cache/SQL
              # time is charged once. CLOCK_BOOTTIME includes any suspended time.
              deadline = monotonic - boot_after + start + 90 * 60 * 1_000_000_000 - 1_000_000_000
              if deadline <= monotonic + 120_000_000_000:
                  raise ValueError("PAPER_FIXTURE_JOB_BUDGET_EXHAUSTED")
              return deadline

          def observed_worker():
              pid, seen, workers = os.getppid(), set(), []
              for _ in range(128):
                  if pid <= 1:
                      break
                  if pid in seen:
                      raise ValueError("PAPER_FIXTURE_JOB_DEADLINE_UNAVAILABLE")
                  seen.add(pid)
                  path = Path("/proc") / str(pid)
                  def identity():
                      fields = (path / "stat").read_text().rsplit(")", 1)[1].split()
                      return int(fields[1]), int(fields[19])
                  before = identity()
                  executable = os.readlink(path / "exe")
                  if Path(executable).name == "Runner.Worker":
                      if identity() != before:
                          raise ValueError("PAPER_FIXTURE_JOB_DEADLINE_UNAVAILABLE")
                      workers.append(before[1])
                  pid = before[0]
              if len(workers) != 1:
                  raise ValueError("PAPER_FIXTURE_JOB_DEADLINE_UNAVAILABLE")
              return workers[0]

          if __name__ == "__main__":
              try:
                  start = observed_worker()
                  mono = time.monotonic_ns()
                  boot = time.clock_gettime_ns(time.CLOCK_BOOTTIME)
                  deadline = worker_deadline(start, os.sysconf("SC_CLK_TCK"), boot, mono)
                  with open(os.environ["GITHUB_ENV"], "a") as stream:
                      stream.write(f"R5_PAPER_JOB_DEADLINE_NS={deadline}\n")
                  print("PAPER_FIXTURE_JOB_BUDGET=CONSERVATIVE_RUNNER_WORKER_START")
              except (OSError, ValueError, IndexError):
                  raise SystemExit("PAPER_FIXTURE_JOB_DEADLINE_UNAVAILABLE")
          PAPER_JOB_DEADLINE
          evidence_dir="${RUNNER_TEMP}/lagrange-pg-validation"
          started=$SECONDS
          bash deploy/db/integration-validation/validate.sh --evidence-dir "$evidence_dir"
          printf 'seconds=%s\n' "$((SECONDS - started))" >>"$GITHUB_OUTPUT"
      - id: libfaketime
        name: Install the pinned process-clock fixture library
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends 'libfaketime=0.9.10-2.1'
          version="$(dpkg-query -W -f='${Version}' libfaketime)"
          [ "$version" = '0.9.10-2.1' ] || { echo 'libfaketime package version mismatch' >&2; exit 1; }
          mapfile -t libraries < <(dpkg-query -L libfaketime | while IFS= read -r path; do
            if [ "$(basename "$path")" = 'libfaketime.so.1' ] && [ -e "$path" ]; then
              resolved="$(realpath -e "$path")"
              [ -f "$resolved" ] && printf '%s\n' "$resolved"
            fi
          done)
          [ "${#libraries[@]}" -eq 1 ] || { echo 'libfaketime.so.1 path is not unique' >&2; exit 1; }
          printf 'path=%s\n' "${libraries[0]}" >>"$GITHUB_OUTPUT"
      - id: paper-sql
        name: Run each named R5 Paper SQL test in isolated PostgreSQL
        env:
          CLOCK_LIBRARY: ${{ steps.libfaketime.outputs.path }}
        run: |
          evidence_dir="${RUNNER_TEMP}/r5-paper-sql-evidence"
          started=$SECONDS
          set +e
          python3 deploy/db/integration-validation/r5-paper-sql.py \
            --evidence-dir "$evidence_dir" --clock-library "$CLOCK_LIBRARY"
          status=$?
          set -e
          printf 'seconds=%s\n' "$((SECONDS - started))" >>"$GITHUB_OUTPUT"
          # Same real job budget covers all setup, SQL, thirteen images and G2.
          [ "$status" -eq 0 ] || exit "$status"
          : "${R5_PAPER_JOB_DEADLINE_NS:?missing job deadline}"
          nonce="$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          source_work="$(mktemp -d "${RUNNER_TEMP}/r5-paper-source.XXXXXXXX")"
          timeout --kill-after=5 60 git clone --quiet --no-local --no-hardlinks --no-checkout \
            -- "$GITHUB_WORKSPACE" "$source_work/repo"
          timeout --kill-after=5 30 git -C "$source_work/repo" checkout --quiet --detach "$GITHUB_SHA"
          [ "$(git -C "$source_work/repo" rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git -C "$source_work/repo" status --porcelain --untracked-files=all)" ]
          source_parent="$(sudo mktemp -d /var/lib/lagrange-paper-fixture-source.XXXXXXXX)"
          source_root="$source_parent/repo"
          sudo timeout --kill-after=5 30 chown -R 0:0 -- "$source_work/repo"
          sudo timeout --kill-after=5 30 mv -- "$source_work/repo" "$source_root"
          rmdir -- "$source_work"
          state_root="/var/tmp/lagrange-paper-fixture-build-$nonce"
          manifest_file="$state_root/release-manifest"
          # Retain producer originals and source inputs on either outcome. G1/G2 own
          # builder/helper/PG/network disposal; uncertain custody retains its inputs.
          echo 'PAPER_FIXTURE_INPUTS=RETAINED_IN_JOB_PRIVATE_DIRECTORIES'
          sudo /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/root LC_ALL=C LANG=C \
            PYTHONDONTWRITEBYTECODE=1 CARGO_BUILD_JOBS=2 COMPOSE_PARALLEL_LIMIT=1 \
            /bin/bash "$source_root/scripts/ops/build-paper-fixture-images.sh" \
            --source-root "$source_root" --commit "$GITHUB_SHA" \
            --state-root "$state_root" --manifest-file "$manifest_file" \
            --deadline-monotonic-ns "$R5_PAPER_JOB_DEADLINE_NS"
          # Safe source/image/producer digests, never compile ENV values or raw logs.
          sudo /usr/bin/python3 - "$state_root/checks.json" <<'PAPER_IMAGE_EVIDENCE'
          import hashlib
          import json
          import pathlib
          import re
          import sys
          path = pathlib.Path(sys.argv[1])
          raw = path.read_bytes()
          value = json.loads(raw)
          assert value["format"] == "lagrange-paper-fixture-image-checks-v1"
          assert re.fullmatch("[0-9a-f]{40}", value["source_commit"])
          assert len(value["services"]) == 13
          services = []
          for item in value["services"]:
              assert re.fullmatch("[a-z0-9-]{1,64}", item["service"])
              assert re.fullmatch("sha256:[0-9a-f]{64}", item["image_id"])
              assert item["revision"] == value["source_commit"]
              services.append({key: item[key] for key in ("service", "image_id", "revision")})
          originals = value["producer_receipt_evidence"]
          assert 1 <= len(originals) <= 32
          receipts = []
          digest_keys = ("artifact_json_sha256", "complete_sha256", "receipt_pair_sha256",
                         "compile_env_sha256", "elf_sha256")
          for item in originals:
              assert item["recipe"] in ("D1", "D7", "D8")
              assert re.fullmatch("[a-z0-9_-]{1,64}", item["bin"])
              assert all(re.fullmatch("[0-9a-f]{64}", item[key]) for key in digest_keys)
              assert type(item["elf_bytes"]) is int and item["elf_bytes"] > 0
              assert item["source_commit"] == value["source_commit"]
              receipts.append({key: item[key] for key in
                  ("recipe", "bin", "source_commit", "elf_bytes", *digest_keys)})
          assert len({item["service"] for item in services}) == 13
          assert {item["recipe"] for item in receipts} == {"D1", "D7", "D8"}
          assert value["cleanup"] == {"helper_server": "reaped",
              "ephemeral_buildx_builder": "removed-and-verified-absent"}
          assert value["runtime_authority"] == "none"
          print(json.dumps({"source_commit": value["source_commit"], "services": services,
              "producer_receipt_evidence": receipts, "checks_sha256": hashlib.sha256(raw).hexdigest(),
              "resource_observation_count": len(value["resource_observations"]),
              "cleanup": value["cleanup"], "runtime_authority": value["runtime_authority"]},
              sort_keys=True, separators=(",", ":")))
          PAPER_IMAGE_EVIDENCE
          sudo /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/root LC_ALL=C LANG=C \
            PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -B \
            "$source_root/scripts/ops/owner-beta-paper-genuine-fixture.py" \
            --source-root "$source_root" --commit "$GITHUB_SHA" \
            --manifest-file "$manifest_file" --deadline-monotonic-ns "$R5_PAPER_JOB_DEADLINE_NS"
      - name: Print sanitized R5 Paper SQL evidence
        if: always()
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/r5-paper-sql-evidence/result.json
        run: |
          if [ ! -f "$EVIDENCE_FILE" ]; then
            echo 'R5 Paper SQL fixture produced no sanitized result.json' >&2
            exit 0
          fi
          python3 - "$EVIDENCE_FILE" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import re
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          lines = ["## R5 Paper SQL fixture", "", f"Status: `{result.get('status', 'UNKNOWN')}`"]
          if result.get("error_code"):
              lines.append(f"Error code: `{result['error_code']}`")
          lines.extend(["", "| Named test | Result | Exit code | Fixture error |", "|---|---|---|---|"])
          lines.extend(
              f"| `{item['name']}` | `{item['result']}` | `{item.get('exit_code')}` | `{item.get('error_code', '-')}` |"
              for item in result.get("test_results", [])
          )
          allowed_categories = {
              "DATABASE", "ROW_NOT_FOUND", "COLUMN_DECODE", "POOL_TIMED_OUT",
              "IO", "ASSERTION", "RUST_PANIC",
          }
          allowed_paths = {
              "tests/paper_0067.rs",
              "tests/migration_contract.rs",
              "tests/integration/migration-contract/tests/paper_0067.rs",
              "tests/integration/migration-contract/tests/migration_contract.rs",
              "tests/paper_0067/audit.rs",
              "tests/paper_0067/restore_reconciliation.rs",
              "tests/integration/migration-contract/tests/paper_0067/audit.rs",
              "tests/integration/migration-contract/tests/paper_0067/restore_reconciliation.rs",
          }
          allowed_test_witness_stages = {
              "READY_SETUP", "READY_T1_TARGET", "READY_T1_SETTLE", "READY_T2_PREVIEW",
              "READY_T2_WAIT", "READY_T1_VALUE", "READY_TRIAL_APPLY", "READY_TRIAL_READBACK",
              "READY_REVOKE_RETRY", "APPLY_POOL_ACQUIRE", "APPLY_QUERY", "TERMINAL_UPDATE",
              "RESET_SETUP", "RESET_BARRIER", "RESET_WAIT", "RESET_BEGIN", "RESET_RECONCILE",
              "RESET_OFF", "RESET_ENABLE", "RESET_READBACK", "AUDIT_READ", "AUDIT_SETUP",
              "AUDIT_TARGET", "AUDIT_E_SOURCE", "AUDIT_SETTLE", "AUDIT_VALUE", "AUDIT_UPGRADE",
              "RECOVERY_V1_SETUP",
              "RECOVERY_V1_TARGET",
              "RECOVERY_V1_E_SOURCE",
              "RECOVERY_V1_SETTLE",
              "RECOVERY_V1_BUILD",
              "RECOVERY_V1_TRANSITION",
              "RECOVERY_V1_READBACK",
              "RECOVERY_V2_SETUP",
              "RECOVERY_V2_TARGET",
              "RECOVERY_V2_E_SOURCE",
              "RECOVERY_V2_SETTLE",
              "RECOVERY_V2_BUILD",
              "RECOVERY_V2_TRANSITION",
              "RECOVERY_V2_READBACK",
          }
          allowed_test_witness_outcomes = {
              "ENTERED", "POOL_PENDING", "QUERY_PENDING", "CLIENT_TIMEOUT", "UPDATE_OK",
              "DATABASE_ERROR", "NON_DATABASE_ERROR",
          }

          allowed_sql_guard_ids = {
              "paper_audit_account_account_strategy_bindings",
              "paper_audit_account_cash_ledger",
              "paper_audit_account_daily_equity",
              "paper_audit_account_fills",
              "paper_audit_account_orders",
              "paper_audit_account_owner_beta_paper_control",
              "paper_audit_account_owner_beta_paper_events",
              "paper_audit_account_owner_beta_paper_lineage",
              "paper_audit_account_owner_beta_paper_sessions",
              "paper_audit_account_paper_rebalance_previews",
              "paper_audit_account_pending_targets",
              "paper_audit_account_positions",
              "paper_audit_daily_admission_pin",
              "paper_audit_daily_attempt_sequence",
              "paper_audit_daily_cancel",
              "paper_audit_daily_failed",
              "paper_audit_daily_final_state",
              "paper_audit_daily_premature_output",
              "paper_audit_daily_queued",
              "paper_audit_daily_reservation",
              "paper_audit_daily_running",
              "paper_audit_daily_success",
              "paper_audit_delivery",
              "paper_audit_fill",
              "paper_audit_history_orphan",
              "paper_audit_lineage",
              "paper_audit_lineage_orphan",
              "paper_audit_notification",
              "paper_audit_obligation",
              "paper_audit_outbox",
              "paper_audit_publication_orphan",
              "paper_audit_receipt",
              "paper_audit_reservation",
              "paper_audit_session",
              "paper_audit_settlement_rows",
              "paper_audit_source_chain",
              "paper_audit_source_orphan",
              "paper_audit_valuation_rows",
              "paper_recovery_v2_control",
              "paper_recovery_v2_rights",
          }

          def sanitize_test_witnesses(value):
              if not isinstance(value, list) or len(value) > 16:
                  return None
              safe = []
              seen = set()
              allowed_keys = {
                  "stage", "outcome", "sqlstate", "backend_pid", "blocker_pid",
                  "advisory_blocked", "completed_before_unlock", "sql_position", "sql_position_kind", "guard_id",
              }
              for item in value:
                  if not isinstance(item, dict) or not {"stage", "outcome"}.issubset(item):
                      return None
                  if set(item) - allowed_keys:
                      return None
                  if not isinstance(item["stage"], str) or item["stage"] not in allowed_test_witness_stages:
                      return None
                  if not isinstance(item["outcome"], str) or item["outcome"] not in allowed_test_witness_outcomes:
                      return None
                  witness = {"stage": item["stage"], "outcome": item["outcome"]}
                  if "sqlstate" in item:
                      code = item["sqlstate"]
                      if not isinstance(code, str) or not code.isascii() or re.fullmatch(r"[A-Z0-9]{5}", code, flags=re.ASCII) is None:
                          return None
                      witness["sqlstate"] = code
                  for key in ("backend_pid", "blocker_pid"):
                      if key in item:
                          pid = item[key]
                          if type(pid) is not int or not (1 <= pid <= 2147483647):
                              return None
                          witness[key] = pid
                  for key in ("advisory_blocked", "completed_before_unlock"):
                      if key in item:
                          if type(item[key]) is not bool:
                              return None
                          witness[key] = item[key]
                  if "sql_position" in item or "sql_position_kind" in item:
                      position = item.get("sql_position")
                      if (type(position) is not int or not 1 <= position <= 1000000
                              or item.get("sql_position_kind") not in ("ORIGINAL", "INTERNAL")):
                          return None
                      witness["sql_position"] = position
                      witness["sql_position_kind"] = item["sql_position_kind"]
                  if "guard_id" in item:
                      name = item["guard_id"]
                      if not isinstance(name, str) or name not in allowed_sql_guard_ids:
                          return None
                      witness["guard_id"] = name
                  encoded = json.dumps(witness, sort_keys=True, separators=(",", ":"))
                  if encoded in seen:
                      return None
                  seen.add(encoded)
                  safe.append(witness)
              return safe

          def sanitize_failure_witness(value):
              base_keys = {"categories", "panic_locations", "sqlstates", "truncated"}
              if not isinstance(value, dict) or frozenset(value) not in {frozenset(base_keys), frozenset(base_keys | {"test_witnesses"})}:
                  return None
              if type(value["truncated"]) is not bool:
                  return None
              categories = value["categories"]
              locations = value["panic_locations"]
              sqlstates = value["sqlstates"]
              if not isinstance(categories, list) or len(categories) > 16:
                  return None
              if any(not isinstance(item, str) or item not in allowed_categories for item in categories):
                  return None
              if len(set(categories)) != len(categories):
                  return None
              if not isinstance(locations, list) or len(locations) > 16:
                  return None
              safe_locations = []
              seen_locations = set()
              for item in locations:
                  if not isinstance(item, dict) or set(item) != {"path", "line", "column"}:
                      return None
                  path = item["path"]
                  line = item["line"]
                  column = item["column"]
                  if not isinstance(path, str) or path not in allowed_paths:
                      return None
                  if type(line) is not int or type(column) is not int:
                      return None
                  if not (1 <= line <= 1000000 and 1 <= column <= 1000000):
                      return None
                  key = (path, line, column)
                  if key in seen_locations:
                      return None
                  seen_locations.add(key)
                  safe_locations.append({"path": path, "line": line, "column": column})
              if not isinstance(sqlstates, list) or len(sqlstates) > 16:
                  return None
              if any(
                  not isinstance(code, str)
                  or not code.isascii()
                  or re.fullmatch(r"[A-Z0-9]{5}", code, flags=re.ASCII) is None
                  for code in sqlstates
              ):
                  return None
              if len(set(sqlstates)) != len(sqlstates):
                  return None
              test_witnesses = None
              if "test_witnesses" in value:
                  test_witnesses = sanitize_test_witnesses(value["test_witnesses"])
                  if test_witnesses is None:
                      return None
              if not categories and not safe_locations and not sqlstates and not test_witnesses:
                  return None
              safe = {
                  "categories": list(categories),
                  "panic_locations": safe_locations,
                  "sqlstates": list(sqlstates),
                  "truncated": value["truncated"],
              }
              if test_witnesses is not None:
                  safe["test_witnesses"] = test_witnesses
              return safe

          witness_rows = []
          for item in result.get("test_results", []):
              if not isinstance(item, dict) or item.get("result") != "FAIL":
                  continue
              name = item.get("name")
              if not isinstance(name, str) or re.fullmatch(
                  r"paper_0067::[A-Za-z0-9_:]+", name, flags=re.ASCII
              ) is None:
                  continue
              witness = sanitize_failure_witness(item.get("failure_witness"))
              if witness is not None:
                  encoded = json.dumps(witness, sort_keys=True, separators=(",", ":"))
                  witness_rows.append(f"| `{name}` | `{encoded}` |")
          if witness_rows:
              lines.extend([
                  "",
                  "| Named test | Sanitized failure witness |",
                  "|---|---|",
                  *witness_rows,
              ])
          container = result.get("container", {})
          postgres = result.get("postgres", {})
          stages = result.get("stages", {})
          lines.extend([
              "",
              f"Owned container: terminal `{container.get('terminal', 'UNKNOWN')}`, removed `{container.get('removed', 'UNKNOWN')}`.",
              f"PostgreSQL: exit `{postgres.get('exit_code')}`, reaped `{postgres.get('reaped', 'UNKNOWN')}`.",
              f"Staging: input `{stages.get('input', 'UNKNOWN')}`, output `{stages.get('output', 'UNKNOWN')}`.",
          ])
          summary = "\n".join(lines) + "\n"
          print(summary, end="")
          with pathlib.Path(sys.argv[2]).open("a") as stream:
              stream.write(summary)
          PY
      - name: Print sanitized PostgreSQL validation evidence
        if: always()
        run: |
          evidence_file="${RUNNER_TEMP}/lagrange-pg-validation/evidence.json"
          if [ -f "$evidence_file" ]; then
            cat "$evidence_file"
          else
            echo 'PostgreSQL validation produced no evidence.json' >&2
          fi
      - name: Print sanitized PostgreSQL validation failure logs
        if: failure()
        run: |
          evidence_dir="${RUNNER_TEMP}/lagrange-pg-validation"
          find "$evidence_dir" -maxdepth 1 -type f -name '*.log' -print0 2>/dev/null |
            sort -z |
            while IFS= read -r -d '' log_file; do
              echo "::group::$(basename "$log_file")"
              tail -n 200 "$log_file"
              echo '::endgroup::'
            done
      - name: Save Cargo download cache
        id: cargo-download-save
        if: success() && steps.cargo-download-restore.outcome == 'success' && steps.cargo-download-restore.outputs.cache-hit != 'true' && github.repository == 'sihioov/Lagrange' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ steps.cargo-cache-keys.outputs.download_key }}
      - name: Save Cargo target cache
        id: cargo-target-save
        if: success() && steps.cargo-target-restore.outcome == 'success' && steps.cargo-target-restore.outputs.cache-hit != 'true' && github.repository == 'sihioov/Lagrange' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/lagrange-cargo-target-postgres
          key: ${{ steps.cargo-cache-keys.outputs.target_key }}
      - name: Write private PostgreSQL cache evidence
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          CACHE_NAMESPACE: ${{ steps.cache-epoch.outputs.value }}
          DOWNLOAD_KEY: ${{ steps.cargo-cache-keys.outputs.download_key }}
          DOWNLOAD_MATCHED: ${{ steps.cargo-download-restore.outputs.cache-matched-key }}
          DOWNLOAD_HIT: ${{ steps.cargo-download-restore.outputs.cache-hit }}
          DOWNLOAD_RESTORE_OUTCOME: ${{ steps.cargo-download-restore.outcome }}
          DOWNLOAD_SAVE_OUTCOME: ${{ steps.cargo-download-save.outcome }}
          TARGET_KEY: ${{ steps.cargo-cache-keys.outputs.target_key }}
          TARGET_MATCHED: ${{ steps.cargo-target-restore.outputs.cache-matched-key }}
          TARGET_HIT: ${{ steps.cargo-target-restore.outputs.cache-hit }}
          TARGET_RESTORE_OUTCOME: ${{ steps.cargo-target-restore.outcome }}
          TARGET_SAVE_OUTCOME: ${{ steps.cargo-target-save.outcome }}
          INSTALL_SECONDS: ${{ steps.rust-install.outputs.seconds || 'unavailable' }}
          TEST_SECONDS: ${{ steps.postgres-validation.outputs.seconds || 'unavailable' }}
          PAPER_SQL_SECONDS: ${{ steps.paper-sql.outputs.seconds || 'unavailable' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/wp3-cache-evidence"
          chmod 700 "${RUNNER_TEMP}/wp3-cache-evidence"
          python3 scripts/ci/cache-evidence.py record \
            --workflow "$GITHUB_WORKFLOW" --job "$GITHUB_JOB" --sha "$SOURCE_SHA" --namespace "$CACHE_NAMESPACE" \
            --cache-entry "cargo-download|$DOWNLOAD_KEY|$DOWNLOAD_MATCHED|$DOWNLOAD_HIT|$DOWNLOAD_RESTORE_OUTCOME|$DOWNLOAD_SAVE_OUTCOME|unavailable" \
            --cache-entry "cargo-target|$TARGET_KEY|$TARGET_MATCHED|$TARGET_HIT|$TARGET_RESTORE_OUTCOME|$TARGET_SAVE_OUTCOME|unavailable" \
            --duration install="$INSTALL_SECONDS" --duration build=0 --duration test="$TEST_SECONDS" \
            --duration test="$PAPER_SQL_SECONDS" \
            --output "${RUNNER_TEMP}/wp3-cache-evidence/postgres-integration-validation.json" --summary "$GITHUB_STEP_SUMMARY"

  r4-verification-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r4_verification_build }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and verify the source-only R4 binary
        run: bash scripts/ci/build-r4-verification.sh
      - name: Upload the R4 binary and provenance
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r4-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/r4-verification-build/delivery/verify_approved_simulation
            ${{ runner.temp }}/r4-verification-build/delivery/provenance.json
            ${{ runner.temp }}/r4-verification-build/delivery/owner-beta-simulation-runner
            ${{ runner.temp }}/r4-verification-build/delivery/simulation-runner-provenance.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload the R4 connection proof and provenance
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r4-connection-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/r4-verification-build/proof-delivery/verify_approved_simulation_connection
            ${{ runner.temp }}/r4-verification-build/proof-delivery/connection-proof-provenance.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  required:
    if: always()
    needs:
      [
        policy,
        format,
        clippy,
        web,
        workspace-tests,
        python-tests,
        postgres-integration-validation,
        r4-verification-build,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          WEB_RESULT: ${{ needs.web.result }}
          TEST_RESULT: ${{ needs.workspace-tests.result }}
          PYTHON_TEST_RESULT: ${{ needs.python-tests.result }}
          POSTGRES_VALIDATION_RESULT: ${{ needs.postgres-integration-validation.result }}
          R4_VERIFICATION_BUILD_SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.r4_verification_build }}
          R4_VERIFICATION_BUILD_RESULT: ${{ needs.r4-verification-build.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$FORMAT_RESULT" = success
          test "$CLIPPY_RESULT" = success
          test "$WEB_RESULT" = success
          test "$TEST_RESULT" = success
          test "$PYTHON_TEST_RESULT" = success
          test "$POSTGRES_VALIDATION_RESULT" = success
          if [ "$R4_VERIFICATION_BUILD_SELECTED" = true ]; then
            test "$R4_VERIFICATION_BUILD_RESULT" = success
          else
            test "$R4_VERIFICATION_BUILD_RESULT" = skipped
          fi

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2
      - run: bash scripts/check-pins.sh
      - name: Verify committed lockfiles
        run: |
          for lf in Cargo.lock package-lock.json; do
            [ -f "$lf" ] || { echo "missing committed lockfile $lf"; exit 1; }
          done
      - run: bash scripts/validate-foundation.sh
      - run: bash deploy/db/integration-validation/static-check.sh
      - run: bash deploy/db/integration-validation/validate.sh --self-test
      - run: bash deploy/compose/candidate-static-check.sh
      # Deployment-safety static checks. These need no Docker, database, root or
      # secret, and each already passed on a clean checkout before being wired —
      # they were simply never referenced by a workflow. They cover the nginx auth
      # routes, the systemd units, secret file modes, the remaining compose files,
      # and migration ordering, which is exactly the surface a release depends on.
      - run: bash deploy/compose/backtest-static-check.sh
      - run: bash deploy/compose/code-commit-static-check.sh
      - run: bash deploy/db/migrate-static-check.sh
      - run: bash deploy/nginx/auth-route-static-check.sh
      - run: bash deploy/secrets/runtime-static-check.sh
      - run: bash deploy/systemd/paper-runner-static-check.sh
      - run: bash deploy/systemd/tailscale-tls-renewal-static-check.sh
      - run: bash scripts/ops/static-check.sh
      - run: bash scripts/ops/production-ops-static-check.sh
      - name: Verify scoped Web/API refresh preserves the original Owner worker
        run: bash scripts/ops/kis-read-compose-self-test.sh
      - name: Verify service-status binding for daily raw and action-supply modes
        run: python -m unittest discover -s scripts/ops -p 'test*service_status*.py' -v
      - run: bash scripts/ops/build-production-images-static-check.sh
      - name: Verify complete image builder with synthetic Docker images
        if: ${{ !cancelled() }}
        run: >-
          sudo env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory
          GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          bash scripts/ops/build-production-images-self-test.sh
      - run: python -m unittest scripts.ci.test_ci_contract -v
      - name: Verify daily release filesystem and principal boundaries
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-release-self-test.py
      - name: Verify fixed historical base copies and real reader principals
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-base-self-test.py
      - name: Verify immutable daily release installation boundaries
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-integration-self-test.py
      - name: Verify daily release database control rendering
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-control-self-test.py
      - name: Verify daily runtime policy and drain failures
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-runtime-self-test.py
      - name: Verify daily actual Docker isolation and drain
        run: sudo "$(command -v python)" scripts/ops/owner-beta-daily-docker-self-test.py
      - name: Verify daily controlled activation and failure ordering
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-operations-self-test.py
      - name: Verify daily actual PostgreSQL control transport
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-transport-self-test.py
      - name: Verify preactivation first-session forward binding
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-first-session-self-test.py
      - name: Verify market-stream grant helper inspection boundaries
        run: python -m unittest scripts.ops.test_market_stream_grant -v
      - name: Verify market-stream grant inspection on isolated PostgreSQL
        if: ${{ !cancelled() }}
        run: sudo nice -n 10 /usr/bin/python3 -B scripts/ops/market-stream-grant-inspect-self-test.py
      - name: Verify daily backup files and failure ordering
        # These fixtures own separate disposable resources. Run all three even
        # after an independent failure; keep each exit status a hard job failure.
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-backup-self-test.py
      - name: Verify daily encrypted full-schema isolated restore
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-backup-docker-self-test.py
      - name: Verify installed backup version transition and recovery
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/production-backup-transition-self-test.py
      - name: Verify pre-upgrade cold archive boundaries
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/production-preupgrade-recovery-self-test.py
      - name: Verify pre-upgrade maintenance failure boundaries
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/production-preupgrade-maintenance-self-test.py
      - name: Verify pre-upgrade schema59 isolated recovery
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/production-preupgrade-recovery-docker-self-test.py
      - name: Verify whole-flow fixture and driver boundaries
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-wholeflow-fixture-self-test.py
      - name: Verify whole-flow actual Docker inherited volume boundaries
        if: ${{ !cancelled() }}
        run: sudo /usr/bin/python3 scripts/ops/owner-beta-daily-wholeflow-docker-self-test.py
      - name: Verify legacy production operations fixtures
        if: ${{ !cancelled() }}
        run: sudo bash scripts/ops/production-ops-self-test.sh

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run openapi:check --workspace @lagrange/api-server
      - run: npm run lint --workspace @lagrange/web
      - run: npm run typecheck --workspace @lagrange/web
      - run: npm test --workspace @lagrange/web
      - name: Check recommendation polling recovery and lifetime in isolated Chromium
        run: node scripts/qa/recommendation-poll-recovery-browser.mjs "/tmp/lagrange-recommendation-poll-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check membership response ordering in isolated Chromium
        run: node scripts/qa/stock-beta-membership-order-browser.mjs "/tmp/lagrange-membership-order-${{ github.run_id }}-${{ github.run_attempt }}"
      - run: npm run build --workspace @lagrange/web
      - run: bash scripts/qa/candidate-web-e2e.sh

  workspace-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Intraday tests require this exact disposable QA endpoint.
      DATABASE_URL: postgres://postgres:lagrange@127.0.0.1:55438/postgres
      LAGRANGE_QA_DB_PORT: '55438'
      LAGRANGE_DAILY_ARTIFACT_TEST_ROOT: /lagrange-daily-artifact-${{ github.run_id }}-${{ github.run_attempt }}/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated Rust toolchain store
        # Preserve rust-toolchain.toml while avoiding preinstalled component conflicts.
        run: |
          set -euo pipefail
          rustup_store="$(mktemp -d "${RUNNER_TEMP}/lagrange-workspace-rustup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          printf 'RUSTUP_HOME=%s\n' "$rustup_store" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir pyarrow==25.0.0 uv==0.12.1
      - run: uv sync --project nt --locked
      - run: python scripts/ci/prepare_phase0.py --root data/phase0
      - run: docker compose -f deploy/qa/qa-db.compose.yml up -d --wait
      - name: Run Owner Equity V2 chart HTTP acceptance tests
        run: cargo test -p api-server --test http_owner_equity_v2_chart --locked
      - name: Prepare protected daily artifact test parent
        run: |
          set -euo pipefail
          fixture_anchor="/lagrange-daily-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$LAGRANGE_DAILY_ARTIFACT_TEST_ROOT" = "$fixture_anchor/runner"
          test "$(stat --format='%u:%a' /)" = '0:755'
          test ! -e "$fixture_anchor"
          test ! -L "$fixture_anchor"
          sudo mkdir -m 0755 -- "$fixture_anchor"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" -- "$fixture_anchor/runner"
          for fixture_node in / "$fixture_anchor" "$fixture_anchor/runner"; do
            test ! -L "$fixture_node"
            stat --format='DAILY_ARTIFACT_FIXTURE_MODE:%u:%g:%a' -- "$fixture_node"
          done
      - run: cargo test --workspace --locked --no-fail-fast --features kis-client/test-support
      - name: Verify reviewed market-stream retirement boundaries
        run: cargo test --locked -p kis-client --features market-stream-provisioning,test-support --lib --bin kis-market-stream-state retirement_
      - name: Lint reviewed market-stream operator tool
        run: cargo clippy --locked -p kis-client --features market-stream-provisioning,test-support --lib --bin kis-market-stream-state -- -D warnings
      - name: Remove empty daily artifact test parent
        if: always()
        run: |
          set -euo pipefail
          fixture_anchor="/lagrange-daily-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$LAGRANGE_DAILY_ARTIFACT_TEST_ROOT" = "$fixture_anchor/runner"
          if test -d "$fixture_anchor/runner"; then sudo rmdir -- "$fixture_anchor/runner"; fi
          if test -d "$fixture_anchor"; then sudo rmdir -- "$fixture_anchor"; fi
      - if: always()
        run: docker compose -f deploy/qa/qa-db.compose.yml down -v --remove-orphans

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Phase 0 golden gate resolves the manifest's pinned code commit
          # with `git rev-parse` (tests/golden/phase0/test_phase0_gate.py). That
          # commit is hundreds of commits behind HEAD, so the default depth-1
          # checkout cannot see it and the evidence checks fail on a clone
          # artifact rather than on real drift. Full history is the input those
          # tests actually assert against.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir pyarrow==25.0.0 uv==0.12.1
      - run: uv sync --project nt --locked
      - run: python scripts/ci/prepare_phase0.py --root data/phase0
      - run: uv run --project nt pytest -q
      - run: bash scripts/backup/tests/test-validate-policy.sh

  postgres-integration-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate PostgreSQL migrations and serving-role boundaries
        run: |
          evidence_dir="${RUNNER_TEMP}/lagrange-pg-validation"
          bash deploy/db/integration-validation/validate.sh --evidence-dir "$evidence_dir"
      - name: Print sanitized PostgreSQL validation evidence
        if: always()
        run: |
          evidence_file="${RUNNER_TEMP}/lagrange-pg-validation/evidence.json"
          if [ -f "$evidence_file" ]; then
            cat "$evidence_file"
          else
            echo 'PostgreSQL validation produced no evidence.json' >&2
          fi
      - name: Print sanitized PostgreSQL validation failure logs
        if: failure()
        run: |
          evidence_dir="${RUNNER_TEMP}/lagrange-pg-validation"
          find "$evidence_dir" -maxdepth 1 -type f -name '*.log' -print0 2>/dev/null |
            sort -z |
            while IFS= read -r -d '' log_file; do
              echo "::group::$(basename "$log_file")"
              tail -n 200 "$log_file"
              echo '::endgroup::'
            done

  required:
    if: always()
    needs:
      [
        policy,
        format,
        clippy,
        web,
        workspace-tests,
        python-tests,
        postgres-integration-validation,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          WEB_RESULT: ${{ needs.web.result }}
          TEST_RESULT: ${{ needs.workspace-tests.result }}
          PYTHON_TEST_RESULT: ${{ needs.python-tests.result }}
          POSTGRES_VALIDATION_RESULT: ${{ needs.postgres-integration-validation.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$FORMAT_RESULT" = success
          test "$CLIPPY_RESULT" = success
          test "$WEB_RESULT" = success
          test "$TEST_RESULT" = success
          test "$PYTHON_TEST_RESULT" = success
          test "$POSTGRES_VALIDATION_RESULT" = success

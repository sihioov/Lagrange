name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-d2-genuine-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 131748b245492db90108b231a11f8e19e2a5b5ac
          path: product-source
          persist-credentials: false
      - name: Install the canonical fixture toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Run D2-only genuine producer and consumer at the failed job's checkout
        shell: bash
        run: |
          commit=131748b245492db90108b231a11f8e19e2a5b5ac
          tree=f0e8324995e05738ebfceccd76578f97245deae6
          nonce="$(/usr/bin/python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          source_work="$(mktemp -d "$RUNNER_TEMP/paper-d2-source.XXXXXXXX")"
          timeout --kill-after=5 60 git clone --quiet --no-local --no-hardlinks --no-checkout \
            -- "$GITHUB_WORKSPACE/product-source" "$source_work/repo"
          timeout --kill-after=5 30 git -C "$source_work/repo" checkout --quiet --detach "$commit"
          test "$(git -C "$source_work/repo" rev-parse HEAD)" = "$commit"
          test "$(git -C "$source_work/repo" rev-parse 'HEAD^{tree}')" = "$tree"
          test -z "$(git -C "$source_work/repo" status --porcelain --untracked-files=all)"
          source_parent="$(sudo mktemp -d /var/lib/lagrange-paper-fixture-source.XXXXXXXX)"
          sudo timeout --kill-after=5 30 chown -R 0:0 -- "$source_work/repo"
          sudo timeout --kill-after=5 30 mv -- "$source_work/repo" "$source_parent/repo"
          rmdir -- "$source_work"
          printf 'D2_DIAGNOSTIC_CHECKOUT=%s tree=%s\n' "$commit" "$tree"
          sudo /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin LC_ALL=C LANG=C \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/scripts/ci/paper-d2-genuine-diagnostic.py" \
            "$source_parent/repo" "$commit" "/var/tmp/lagrange-paper-fixture-build-$nonce"

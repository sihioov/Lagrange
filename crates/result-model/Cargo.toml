[package]
name = "result-model"
description = "Lagrange Station common result model and warning/error envelopes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# SQLx 0.9.x is the approved line (plan draft line 40; already in Cargo.lock
# via job-queue/migration-contract). Used by the T3 backtest-result manifest
# writer (`manifest.rs`); `migrate` embeds migrations for the DB-gated tests.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
# Pure-Rust hashing for golden-artifact verification (Todo 21 core gate).
sha2 = "0.10"
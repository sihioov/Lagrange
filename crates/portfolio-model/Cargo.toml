[package]
name = "portfolio-model"
description = "Lagrange Station shared sizing, costs, and replayable ledger invariants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
selector = { path = "../selector" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# v5 mints the deterministic, account-scoped Paper order/fill ids that make
# a crashed session re-plan to byte-identical events (Todo 31).
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }

[dev-dependencies]
proptest = "1.0"

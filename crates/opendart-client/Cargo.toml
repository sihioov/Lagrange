[package]
name = "opendart-client"
description = "Lagrange Station OpenDART disclosure adapter (read-only, Stage6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tempfile = "3"

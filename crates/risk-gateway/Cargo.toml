[package]
name = "risk-gateway"
description = "Lagrange Station persisted risk gatekeeper before broker submission."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# The store trait is async because the real implementation writes to
# PostgreSQL; the tests need a runtime to drive it, nothing more.
tokio = { version = "1", features = ["macros", "rt"] }

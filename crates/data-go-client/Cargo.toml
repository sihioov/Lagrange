[package]
name = "data-go-client"
description = "Lagrange Station allowlisted FSC public-data read client for fixed ETF identity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rustix = { version = "1.1", features = ["fs"] }
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tempfile = "3"

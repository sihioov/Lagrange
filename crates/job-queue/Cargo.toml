[package]
name = "job-queue"
description = "Lagrange Station PostgreSQL job queue: leases, attempts, cancellation, orphan recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The factor values a baseline backtest decides from. Pulled in so the RUNNER
# computes them with the same engine the paper and live paths use: a second
# definition in Python would make a backtest disagree with the behaviour the
# Paper promotion gate compares it against.
factor-engine = { path = "../factor-engine" }
# The strategy registry: which factors each baseline needs and how much
# history. Read rather than restated, so this is not a fourth copy of it.
selector = { path = "../selector" }
# The versioned cost profiles. Read rather than restated: `cost.rs` is
# explicit that rates are configuration, not code constants.
portfolio-model = { path = "../portfolio-model" }
market-data = { path = "../market-data" }
domain = { path = "../domain" }
# SQLx 0.9.x is the approved line (plan draft 2026-08-04 line 40; already in
# Cargo.lock via migration-contract). `json` decodes payload_json into
# serde_json::Value; `chrono` maps timestamptz columns; `macros` supplies the
# FromRow derives; `migrate` embeds migrations/ for the test harness only.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1", # `process` spawns the backtest worker as a CHILD: a simulation that
# exhausts memory must take its own process down, not the runner holding
# the claim.
# `signal` lets the daemon settle the job it is holding before it exits: a
# process aborted mid-claim leaves the row RUNNING until a sweep.
features = ["rt-multi-thread", "macros", "time", "process", "signal", "io-util", "sync", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2.0"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

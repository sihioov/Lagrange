[package]
name = "job-queue"
description = "Lagrange Station PostgreSQL job queue: leases, attempts, cancellation, orphan recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# SQLx 0.9.x is the approved line (plan draft 2026-08-04 line 40; already in
# Cargo.lock via migration-contract). `json` decodes payload_json into
# serde_json::Value; `chrono` maps timestamptz columns; `macros` supplies the
# FromRow derives; `migrate` embeds migrations/ for the test harness only.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1", # `process` spawns the backtest worker as a CHILD: a simulation that
# exhausts memory must take its own process down, not the runner holding
# the claim.
features = ["rt-multi-thread", "macros", "time", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"

[package]
name = "auth"
description = "Lagrange Station authentication and authorization (Auth0 OIDC, sessions, RBAC)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Todo 22: confidential OIDC/session core. Hand-rolled minimal crypto/protocol
# core (PKCE S256, RS256 JWT/JWKS validation, opaque session hashing) over
# small primitives instead of a heavy oauth2/JWT framework; every primitive is
# already pinned by the workspace lock (ring serves rustls; sha2/base64/hex
# serve the ingest/parquet stack; rand is shared). axum stays OUT of this
# crate: `apps/api-server/auth` owns the Axum router.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
ring = "0.17"
chrono = "0.4"
email_address = "0.2"
async-trait = "0.1"
url = "2.5"
subtle = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

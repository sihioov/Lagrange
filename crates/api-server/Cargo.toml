# Lagrange Station typed tenancy repositories (plan Todo 23).
#
# This crate resolves the plan-command defect documented in the
# migration-contract crate: the plan's acceptance lines use `cargo test -p
# api-server`, which requires a Rust package literally named `api-server`
# (apps/api-server is the Node/TypeScript product boundary). The typed
# repositories live here: every method receives an authenticated
# `auth::entitlement::Actor` and runs inside a transaction that pins
# `app.actor_user_id` (SET LOCAL), so PostgreSQL Row-Level Security (migration
# 0010_rls) scopes every row access to the acting user.
#
# SQLx 0.9.x is the approved line (plan draft line 40, Cargo.lock).
[package]
name = "api-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
auth = { path = "../auth" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
domain = { path = "../domain" }
risk-gateway = { path = "../risk-gateway" }
kis-client = { path = "../kis-client" }
async-trait = "0.1"
hex = "0.4"
hmac = "0.12"
job-queue = { path = "../job-queue" }
jsonschema = "0.49.5"
portfolio-model = { path = "../portfolio-model" }
prometheus = "0.14"
regex = "1"
result-model = { path = "../result-model" }
selector = { path = "../selector" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
# The Paper execution seam test writes its own curated bars: the phase-0
# zone's absolute prices are 10,000x too large (see paper_execution_seam.rs),
# so a session priced from it would prove nothing about the arithmetic.
market-data = { path = "../market-data" }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

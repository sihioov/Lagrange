[package]
name = "market-data"
description = "Lagrange Station market-data domain: instruments, calendars, bars, quality, curation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
auth = { path = "../auth" }
kis-client = { path = "../kis-client" }
opendart-client = { path = "../opendart-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2.0"
arrow = { version = "59.1.0", default-features = false, features = ["prettyprint"] }
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "snap"] }
fs2 = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v5", "serde"] }
encoding_rs = "0.8"
crc32fast = "1.5"
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

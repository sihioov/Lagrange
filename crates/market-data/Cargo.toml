[package]
name = "market-data"
description = "Lagrange Station market-data domain: instruments, calendars, bars, quality, curation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { path = "../domain" }
auth = { path = "../auth" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2.0"
arrow = { version = "59.1.0", default-features = false, features = ["prettyprint"] }
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "snap"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

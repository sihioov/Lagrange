[package]
name = "kis-client"
description = "Lagrange Station KIS broker adapter (Phase 3, owner-only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Serializing token issue/refresh needs an async mutex held across an await.
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

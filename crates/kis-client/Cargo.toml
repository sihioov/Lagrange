[package]
name = "kis-client"
description = "Lagrange Station KIS broker adapter (Phase 3, owner-only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Synthetic loopback/process fixtures are deliberately opt-in.  Production
# provisioning uses its own opt-in feature and does not enable test helpers.
test-support = []
market-stream-provisioning = ["dep:libc"]

[[bin]]
name = "kis-market-stream-state"
path = "src/bin/kis-market-stream-state.rs"
required-features = ["market-stream-provisioning"]

[[test]]
name = "market_stream_provisioning"
path = "tests/market_stream_provisioning.rs"
required-features = ["market-stream-provisioning"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Serializing token issue/refresh needs an async mutex held across an await.
# The market stream additionally uses bounded TCP/WebSocket framing.
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "io-util"] }
async-trait = "0.1"
# Same declaration as apps/api-server/auth: rustls only, no default
# features, so the workspace has ONE TLS stack rather than two. Already
# in Cargo.lock at 0.12.28, so this adds no new supply-chain surface.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
fs2 = "0.4"
libc = { version = "0.2", optional = true }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
sha1_smol = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
tempfile = "3"

# Lagrange Station — Nginx edge config (design §13.3, NFR-SEC-001).
#
#   * TLS terminates here; the ONLY published listener is 8443 (host 443).
#   * 8080 is a plain-HTTP internal listener used for (a) the healthcheck
#     and (b) http->https redirects. It is never published to the host.
#   * /internal-artifacts/ is an `internal` location (Nginx `internal;`)
#     that serves artifact bytes after the api-server authorizes a request
#     and answers with an `X-Accel-Redirect: /internal-artifacts/<key>`
#     header. It is unreachable from clients directly (404/444 without the
#     header). `disable_symlinks on` prevents symlink-based path escapes.
#   * The artifact tree is mounted read-only into this container.
#
# TLS certificate/key paths are Docker secrets mounted at /run/secrets. The
# TLS server uses a deliberate catch-all name so certificate/SNI selection is
# the only deployment-specific edge input. There is intentionally NO port-80
# publish: the security posture exposes only 443.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;          # do not leak the nginx version
    client_max_body_size 4m;

    # Login is the unauthenticated credential-entry point. Keep the zone
    # bounded and keyed by the client IP seen at the edge; callback, logout,
    # and session requests remain in the unthrottled /auth/ proxy location.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;

    # ------------------------------------------------------------------
    # Internal plain-HTTP listener (never published): health + redirect.
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # TLS edge. Published to the host as 443:8443.
    # ------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        # Catch-all is deliberate: the certificate/SNI policy is supplied by
        # the mounted production certificate, while the edge never trusts a
        # client-provided Host value for routing to an arbitrary upstream.
        server_name _;

        ssl_certificate     /run/secrets/lagrange_tls_cert;
        ssl_certificate_key /run/secrets/lagrange_tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # Edge health probe (TLS path).
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # --- API (Axum) -------------------------------------------------
        location /api/ {
            proxy_pass http://api-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # --- OIDC/session authority (Axum) ------------------------------
        # Auth0 redirects and browser session endpoints must never fall
        # through to the web UI. The `^~` prefix is deliberately before the
        # catch-all location below and forwards the original path, query,
        # cookies, and response headers (Location, Set-Cookie, X-CSRF-Token).
        # Auth responses are private even when an upstream handler omits its
        # own cache directive, so repeat the server security headers here:
        # Nginx does not inherit parent add_header directives once a location
        # declares its own add_header entries.
        location = /auth/login {
            limit_req zone=auth_login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://api-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass_header Location;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-CSRF-Token;
            proxy_read_timeout 60s;

            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
        }

        location ^~ /auth/ {
            proxy_pass http://api-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass_header Location;
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-CSRF-Token;
            proxy_read_timeout 60s;

            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
        }

        # --- Web UI (Next.js) -------------------------------------------
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Authorized artifact delivery (X-Accel-Redirect target) ------
        # The api-server returns `X-Accel-Redirect: /internal-artifacts/<key>`
        # only after ownership/entitlement checks; Nginx then streams the
        # file from the read-only artifact mount. Clients can never request
        # this location directly (Nginx answers 404).
        location /internal-artifacts/ {
            internal;
            disable_symlinks on;
            alias /data/artifacts/;
            add_header X-Content-Type-Options nosniff;
        }
    }
}

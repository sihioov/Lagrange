# Lagrange Station — single-host production Compose deployment.
#
# Security posture (design §13.3, NFR-SEC-001..003):
#   * ONLY port 443 is published to the host (reverse-proxy -> 8443 inside).
#   * Dockerfile base images are pinned BY DIGEST. Locally built service
#     outputs are not immutable registry image digests.
#   * PostgreSQL and all workers are reachable only on internal networks;
#     published ports exist on NO other service.
#   * nt-backtest-worker-1/2 are attached ONLY to `backtest-iso`, an
#     `internal: true` network — no default route, no internet egress.
#   * Secrets are Docker secrets mounted at /run/secrets/<name>; no
#     plaintext secret appears in this file or in Git (see ../secrets/).
#   * live-node-owner is gated behind the `live` profile (inactive by
#     default); metrics is gated behind the `monitoring` profile.
#   * Data mounts for shared datasets are read-only; per-run artifact
#     mounts are writable only for the service that produces them.
#
# Every long-lived service below runs its checked-in production entrypoint.
# Build contexts point at Dockerfiles with digest-pinned base images; one-shot
# bootstrap/migration/schema services fail closed before serving workloads.
# The API and backtest-runner images embed the exact 40-hex Git commit in their
# OCI revision labels and runtime ENV. CI must supply LAGRANGE_CODE_COMMIT at
# build time; Compose intentionally does not override those image-baked values
# later.

name: lagrange-station

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# Data roots. Bind-mounted relative to this file's directory (deploy/compose).
# Override LAGRANGE_DATA_DIR with an absolute path in production.

services:
  # ------------------------------------------------------------------
  # reverse-proxy — Nginx TLS edge. ONLY published port (443:8443).
  # nginxinc/nginx-unprivileged 1.28-alpine (non-root).
  # ------------------------------------------------------------------
  reverse-proxy:
    image: nginxinc/nginx-unprivileged@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8 # tag: 1.28-alpine
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    logging: *default-logging
    ports:
      # The single host-published port of the whole station.
      - "443:8443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only view of the artifact tree for X-Accel-Redirect delivery
      # (internal /internal-artifacts/ location; never a public path).
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}:/data/artifacts:ro
    secrets:
      - source: reverse_proxy_tls_cert
        target: lagrange_tls_cert
        uid: "101"
        gid: "101"
        mode: 0440
      - source: reverse_proxy_tls_key
        target: lagrange_tls_key
        uid: "101"
        gid: "101"
        mode: 0440
    networks:
      - edge
    healthcheck:
      # Container listens on 8080 (plain, internal-only health/redirect) and
      # 8443 (TLS, published as 443). Health never goes over TLS.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api-server:
        condition: service_healthy
      web:
        condition: service_healthy

  # ------------------------------------------------------------------
  # web — Next.js 16 standalone runtime (node:24.13.1-alpine). Auth is handled
  # by api-server (the web shell forwards only the opaque session cookie, so
  # it holds no credentials). The image is built from apps/web/Dockerfile.
  # ------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api-server:8080}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command: ["node", "apps/web/server.js"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Same-origin API client target (internal network; never public).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api-server:8080}
      # Public base for the login/callback handoff (no secret material).
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api-server:
        condition: service_healthy

  # ------------------------------------------------------------------
  # api-server — Axum REST/OpenAPI authority. The multi-stage Dockerfile
  # builds and runs the checked-in binary as UID 10001; startup validates all
  # role-scoped pools, the cursor secret, artifact root, and dataset pin.
  # ------------------------------------------------------------------
  api-server:
    build:
      context: ../..
      dockerfile: crates/api-server/Dockerfile
      args:
        LAGRANGE_CODE_COMMIT: ${LAGRANGE_CODE_COMMIT:?LAGRANGE_CODE_COMMIT must be supplied by CI as the exact 40-hex Git commit}
    init: true
    restart: unless-stopped
    # The API allows 30s for in-flight HTTP requests and up to 10s for the
    # durable audit outbox drain. Keep a margin above that 40s process budget
    # so Docker does not send SIGKILL before graceful shutdown completes.
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    entrypoint: ["/usr/local/bin/api-server"]
    environment:
      APP_ENV: ${API_APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      RUST_LOG: ${RUST_LOG:-info}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      ADMIN_DB_HOST: postgres
      ADMIN_DB_PORT: "5432"
      ADMIN_DB_NAME: ${POSTGRES_DB:-lagrange}
      ADMIN_DB_USER: admin
      ADMIN_DB_PASSWORD_FILE: /run/secrets/db_admin_password
      AUDIT_DB_HOST: postgres
      AUDIT_DB_PORT: "5432"
      AUDIT_DB_NAME: ${POSTGRES_DB:-lagrange}
      AUDIT_DB_USER: audit_writer
      AUDIT_DB_PASSWORD_FILE: /run/secrets/db_audit_password
      DB_APP_MAX_CONNECTIONS: ${DB_APP_MAX_CONNECTIONS:-16}
      DB_ADMIN_MAX_CONNECTIONS: ${DB_ADMIN_MAX_CONNECTIONS:-4}
      DB_AUDIT_MAX_CONNECTIONS: ${DB_AUDIT_MAX_CONNECTIONS:-4}
      DB_ACQUIRE_TIMEOUT_SECS: ${DB_ACQUIRE_TIMEOUT_SECS:-10}
      CURSOR_SECRET_FILE: /run/secrets/cursor_secret
      ARTIFACT_ROOT: /data/artifacts
      RECOMMENDATION_DATASET_VERSION_ID: ${RECOMMENDATION_DATASET_VERSION_ID:-}
      RECOMMENDATION_DATASET_ID: ${RECOMMENDATION_DATASET_ID:-}
      RECOMMENDATION_DATASET_VERSION: ${RECOMMENDATION_DATASET_VERSION:-}
      RECOMMENDATION_CURATED_VERSION: ${RECOMMENDATION_CURATED_VERSION:-}
      RECOMMENDATION_DATASET_MANIFEST_SHA256: ${RECOMMENDATION_DATASET_MANIFEST_SHA256:-}
      SESSION_COOKIE_SECURE: "true"
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      # Must exactly match the HTTPS callback registered with Auth0. The edge
      # routes /auth/* to this API service before the web catch-all.
      AUTH0_REDIRECT_URI: ${AUTH0_REDIRECT_URI:-https://app.lagrange.local/auth/callback}
      AUTH0_CLIENT_SECRET_FILE: /run/secrets/auth0_client_secret
    secrets:
      - source: api_db_app_password
        target: db_app_password
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: api_db_admin_password
        target: db_admin_password
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: api_db_audit_password
        target: db_audit_password
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: api_cursor_secret
        target: cursor_secret
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: api_session_secret
        target: session_secret
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: api_csrf_secret
        target: csrf_secret
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: api_auth0_client_secret
        target: auth0_client_secret
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      # Read-only artifact tree: the download route hashes files against the
      # result_artifacts manifest before issuing the internal redirect. New
      # backtest publications live below immutable generations/<commit>/<uuid>
      # directories; legacy replicas may still write only the old canonical
      # run names without being able to alter a settled generation.
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}:/data/artifacts:ro
    networks:
      - edge
      - backend
    healthcheck:
      # Dependency conditions must wait for all role-scoped pools and startup
      # gates, so use readiness rather than the liveness-only endpoint.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # db-role-bootstrap — idempotent role/grant bootstrap. This is a one-shot
  # administrator operation and is intentionally separate from migrations:
  # migration SQL never creates login roles. Every role password is read from
  # a Docker secret file and the service must complete before migrations.
  # ------------------------------------------------------------------
  db-role-bootstrap:
    build:
      context: ../..
      dockerfile: deploy/db/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    entrypoint: ["/usr/local/bin/lagrange-bootstrap-roles"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_ADMIN_USER: ${POSTGRES_USER:-lagrange}
      DB_ADMIN_PASSWORD_FILE: /run/secrets/postgres_password
      DB_MIGRATION_OWNER_PASSWORD_FILE: /run/secrets/db_migration_owner_password
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      DB_WORKER_PASSWORD_FILE: /run/secrets/db_worker_password
      DB_AUDIT_PASSWORD_FILE: /run/secrets/db_audit_password
      DB_RESEARCH_PASSWORD_FILE: /run/secrets/db_research_password
      DB_ADMIN_ROLE_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - source: bootstrap_postgres_password
        target: postgres_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: bootstrap_db_migration_owner_password
        target: db_migration_owner_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: bootstrap_db_app_password
        target: db_app_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: bootstrap_db_worker_password
        target: db_worker_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: bootstrap_db_audit_password
        target: db_audit_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: bootstrap_db_research_password
        target: db_research_password
        uid: "999"
        gid: "999"
        mode: 0400
      - source: bootstrap_db_admin_password
        target: db_admin_password
        uid: "999"
        gid: "999"
        mode: 0400
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # db-migrate — one-shot SQLx migration gate. It runs as migration_owner
  # using component-mode DB_* settings and the mounted migration-owner
  # password file, then every serving/worker service depends on successful
  # completion. It never runs as a serving role and never accepts plaintext
  # credentials.
  # ------------------------------------------------------------------
  db-migrate:
    build:
      context: ../..
      dockerfile: deploy/db/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    entrypoint: ["/usr/local/bin/lagrange-migrate"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: migration_owner
      DB_PASSWORD_FILE: /run/secrets/db_migration_owner_password
      MIGRATIONS_DIR: /opt/lagrange/migrations
    secrets:
      - source: migrate_db_migration_owner_password
        target: db_migration_owner_password
        uid: "999"
        gid: "999"
        mode: 0400
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      db-role-bootstrap:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # postgres — PostgreSQL 18 (18.4). Internal-only; never published.
  # Password injected from a Docker secret (_FILE variant), never env.
  # ------------------------------------------------------------------
  postgres:
    image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a # tag: 18.4
    init: true
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lagrange}
      POSTGRES_DB: ${POSTGRES_DB:-lagrange}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_postgres_password
        target: postgres_password
        uid: "999"
        gid: "999"
        mode: 0440
    volumes:
      # DB data on a dedicated named volume (backed up by deploy/backup/).
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data: the
      # PG18 image keeps data in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) and refuses the pre-18 path.
      - pgdata:/var/lib/postgresql
    networks:
      - backend
      # Also on the isolated backtest network so nt-backtest-worker-* can
      # reach the queue DB without ever touching a network that has egress.
      - backtest-iso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lagrange} -d ${POSTGRES_DB:-lagrange}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------
  # research-raw-init — one-shot ownership fence for Raw and Curated roots.
  # Root is used only for this chown/chmod; the filesystem root is read-only,
  # the service has no network or secrets, and it cannot restart.
  # ------------------------------------------------------------------
  research-raw-init:
    image: alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d # tag: 3.21
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/raw /data/curated
        find /data/raw -xdev -type d -exec chown 10001:10001 {} +
        find /data/raw -xdev -type d -exec chmod 0750 {} +
        find /data/raw -xdev -type f -exec chown 10001:10001 {} +
        find /data/raw -xdev -type f \( -name manifest.jsonl -o -name commit.lock \) -exec chmod 0640 {} +
        find /data/raw -xdev -type f ! \( -name manifest.jsonl -o -name commit.lock \) -exec chmod 0440 {} +
        find /data/curated -xdev -type d -exec chown 10001:10001 {} +
        find /data/curated -xdev -type d -exec chmod 0750 {} +
        find /data/curated -xdev -type f -exec chown 10001:10001 {} +
        find /data/curated -xdev -type f -exec chmod 0440 {} +
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/raw:/data/raw
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated

  # ------------------------------------------------------------------
  # research-schema-check — fail-closed migration/role contract gate.
  # This service never mutates schema. The db-migrate one-shot must complete;
  # only then can this exact contract gate research-worker.
  # ------------------------------------------------------------------
  research-schema-check:
    image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a # tag: 18.4
    read_only: true
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$(cat "$$DB_PASSWORD_FILE")"
        exec psql -X -v ON_ERROR_STOP=1 -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" -f /opt/lagrange/research-schema-check.sql
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: ${POSTGRES_USER:-lagrange}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: schema_check_postgres_password
        target: postgres_password
        uid: "999"
        gid: "999"
        mode: 0440
    volumes:
      - type: bind
        source: ./research-schema-check.sql
        target: /opt/lagrange/research-schema-check.sql
        read_only: true
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # research-worker — KRX ingestion/curation/catalog.
  # The ONLY data-collection worker; it needs internet egress for the
  # licensed KRX source, so it sits on `backend` (not internal).
  # Writes immutable Raw and Curated evidence. Catalog metadata is published
  # through narrow SECURITY DEFINER procedures by the least-privilege
  # research_writer role; that role has no broad dataset_versions DML.
  # ------------------------------------------------------------------
  research-worker:
    build:
      context: ../..
      dockerfile: data-pipelines/collectors/Dockerfile
    entrypoint: ["/usr/local/bin/research-worker"]
    init: true
    restart: unless-stopped
    stop_grace_period: 16m
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    cpus: "2"
    mem_limit: 4g
    environment:
      # Production Compose requires an explicit environment selection. The
      # deterministic fixture is available only through an explicit
      # nonproduction override, e.g. RESEARCH_APP_ENV=qa together with
      # RESEARCH_FETCH_MODE=synthetic.
      APP_ENV: ${RESEARCH_APP_ENV:?RESEARCH_APP_ENV must be explicitly set (production for deployment; qa/development only for fixture runs)}
      RESEARCH_FETCH_MODE: ${RESEARCH_FETCH_MODE:-credentialed}
      RESEARCH_RUN_AT_KST: ${RESEARCH_RUN_AT_KST:-16:30}
      RESEARCH_MAX_PUBLICATION_AGE_SECS: ${RESEARCH_MAX_PUBLICATION_AGE_SECS:-345600}
      RESEARCH_ATTEMPT_TIMEOUT_SECS: ${RESEARCH_ATTEMPT_TIMEOUT_SECS:-900}
      RESEARCH_RAW_ROOT: /data
      RESEARCH_CURATED_ROOT: /data
      RESEARCH_ENTITLEMENT_REFERENCE: ${RESEARCH_ENTITLEMENT_REFERENCE:?RESEARCH_ENTITLEMENT_REFERENCE must identify the exact active candidate-use contract}
      RESEARCH_SYNTHETIC_BUNDLE: /opt/lagrange/tests/fixtures/kr-etf/contract
      RESEARCH_CANDIDATE_ENABLED: "true"
      RESEARCH_CANDIDATE_RAW_ROOT: /data/raw/candidate
      RESEARCH_CANDIDATE_SYNTHETIC_BUNDLE: /opt/lagrange/tests/fixtures/kr-candidates/contract
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: research_writer
      DB_PASSWORD_FILE: /run/secrets/db_research_password
      KRX_CREDENTIAL_FILE: /run/secrets/krx_api_key
    secrets:
      - source: research_db_research_password
        target: db_research_password
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: research_krx_api_key
        target: krx_api_key
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/raw:/data/raw
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/research-worker", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      research-raw-init:
        condition: service_completed_successfully
      research-schema-check:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # recommendation-runner — fixed 11-ETF target generation and opt-in Paper
  # scheduling. It has no broker credentials and reads only curated data plus
  # the immutable universe pin.
  # ------------------------------------------------------------------
  recommendation-runner:
    build:
      context: ../..
      dockerfile: crates/job-queue/Dockerfile
    entrypoint: ["/usr/local/bin/recommendation-runner"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/recommendation-health:uid=10001,gid=10001,mode=0750
    logging: *default-logging
    cpus: "2"
    mem_limit: 4g
    environment:
      APP_ENV: ${RECOMMENDATION_APP_ENV:-production}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: worker
      DB_PASSWORD_FILE: /run/secrets/db_worker_password
      RECOMMENDATION_HEALTH_STATE_PATH: /run/recommendation-health/health.json
      RECOMMENDATION_HEALTH_MAX_AGE_SECS: "180"
      RECOMMENDATION_DATASET_VERSION_ID: ${RECOMMENDATION_DATASET_VERSION_ID:-}
      RECOMMENDATION_DATASET_ID: ${RECOMMENDATION_DATASET_ID:-krx_eod_bars}
      RECOMMENDATION_DATASET_VERSION: ${RECOMMENDATION_DATASET_VERSION:-}
      RECOMMENDATION_CURATED_VERSION: ${RECOMMENDATION_CURATED_VERSION:-}
      RECOMMENDATION_DATASET_MANIFEST_SHA256: ${RECOMMENDATION_DATASET_MANIFEST_SHA256:-}
    command:
      - --repo-root
      - /opt/lagrange
      - --data-root
      - /data/curated
      - --universe-manifest
      - /opt/lagrange/configs/universes/kr-etf-core-v1.yaml
      - --uv-bin
      - /usr/local/bin/uv
      - --temp-root
      - /tmp
      - --poll-ms
      - "2000"
      - --sweep-ms
      - "30000"
      - --heartbeat-ms
      - "10000"
      - --lease-ms
      - "60000"
      - --backoff-ms
      - "30000"
      - --child-timeout-ms
      - "120000"
    secrets:
      - source: recommendation_db_worker_password
        target: db_worker_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ../../configs/universes/kr-etf-core-v1.yaml:/opt/lagrange/configs/universes/kr-etf-core-v1.yaml:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/recommendation-runner", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # candidate-runner — common KOSPI-200 research feed, screener snapshots,
  # and deep-analysis publication. It never creates orders or target weights.
  # Every run is bound to six exact source pins and candidate-use rights.
  # ------------------------------------------------------------------
  candidate-runner:
    build:
      context: ../..
      dockerfile: crates/job-queue/Dockerfile
    entrypoint: ["/usr/local/bin/candidate-runner"]
    init: true
    restart: unless-stopped
    stop_grace_period: 5m
    read_only: true
    tmpfs:
      - /tmp
      - /run/candidate-health:uid=10001,gid=10001,mode=0750
    logging: *default-logging
    cpus: "2"
    mem_limit: 4g
    environment:
      APP_ENV: ${CANDIDATE_APP_ENV:-production}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: worker
      DB_PASSWORD_FILE: /run/secrets/db_worker_password
      CANDIDATE_DATA_ROOT: /data
      CANDIDATE_HEALTH_STATE_PATH: /run/candidate-health/health.json
      CANDIDATE_HEALTH_MAX_AGE_SECS: ${CANDIDATE_HEALTH_MAX_AGE_SECS:-180}
      CANDIDATE_POLL_MS: ${CANDIDATE_POLL_MS:-2000}
      CANDIDATE_SCHEDULE_POLL_SECS: ${CANDIDATE_SCHEDULE_POLL_SECS:-60}
      CANDIDATE_SWEEP_MS: ${CANDIDATE_SWEEP_MS:-30000}
      CANDIDATE_HEARTBEAT_MS: ${CANDIDATE_HEARTBEAT_MS:-10000}
      CANDIDATE_LEASE_MS: ${CANDIDATE_LEASE_MS:-60000}
      CANDIDATE_BACKOFF_MS: ${CANDIDATE_BACKOFF_MS:-30000}
    secrets:
      - source: candidate_db_worker_password
        target: db_worker_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/candidate-runner", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # nt-backtest-worker-1 / nt-backtest-worker-2 — real queue daemons running
  # the checked-in Rust supervisor and pinned NT child image. Design §13.3:
  # NO internet. Attached ONLY to `backtest-iso` (internal: true, no default
  # route). Read-only dataset/catalog mounts; writable per-run artifact mount;
  # DB access via postgres on backtest-iso. The Rust runner publishes into
  # immutable generations/<commit>/<publication-uuid>; the old canonical
  # <run>/artifacts names remain compatibility-only for pre-isolation replicas.
  # ------------------------------------------------------------------
  nt-backtest-worker-1:
    build:
      context: ../..
      dockerfile: crates/job-queue/Dockerfile.backtest-runner
      args:
        LAGRANGE_CODE_COMMIT: ${LAGRANGE_CODE_COMMIT:?LAGRANGE_CODE_COMMIT must be supplied by CI as the exact 40-hex Git commit}
    init: true
    restart: unless-stopped
    # The supervisor needs its full 15s drain budget to terminate a child,
    # settle the claim, and let the lease sweeper own anything unfinished.
    # Docker's default 10s stop timeout would cut that recovery path short.
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    entrypoint: ["/usr/local/bin/backtest-runner"]
    cpus: "4"
    mem_limit: 6g
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: worker
      DB_PASSWORD_FILE: /run/secrets/db_worker_password
      LAGRANGE_REPO_ROOT: /opt/lagrange
      LAGRANGE_DATASET_ROOT: /data
      LAGRANGE_ARTIFACTS_ROOT: /data/artifacts/backtest/runs
      LAGRANGE_UV_BIN: /usr/local/bin/uv
      DATA_CATALOG_DIR: /data/nautilus_catalog
      DATA_CURATED_DIR: /data/curated
      ARTIFACT_RUN_DIR: /data/artifacts/backtest/runs
      BACKTEST_MIN_FREE_BYTES: ${BACKTEST_MIN_FREE_BYTES:?BACKTEST_MIN_FREE_BYTES must be set}
      BACKTEST_MAX_QUEUED_BACKTESTS: ${BACKTEST_MAX_QUEUED_BACKTESTS:?BACKTEST_MAX_QUEUED_BACKTESTS must be set}
      BACKTEST_RECONCILE_GRACE_SECS: ${BACKTEST_RECONCILE_GRACE_SECS:?BACKTEST_RECONCILE_GRACE_SECS must be set}
      BACKTEST_RECONCILE_INTERVAL_SECS: ${BACKTEST_RECONCILE_INTERVAL_SECS:?BACKTEST_RECONCILE_INTERVAL_SECS must be set}
    secrets:
      - source: backtest_1_db_worker_password
        target: db_worker_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ${LAGRANGE_DATA_DIR:-../data}/nautilus_catalog:/data/nautilus_catalog:ro
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}/backtest/runs:/data/artifacts/backtest/runs
    networks:
      - backtest-iso
    healthcheck:
      test: ["CMD", "/usr/local/bin/backtest-runner", "readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  nt-backtest-worker-2:
    build:
      context: ../..
      dockerfile: crates/job-queue/Dockerfile.backtest-runner
      args:
        LAGRANGE_CODE_COMMIT: ${LAGRANGE_CODE_COMMIT:?LAGRANGE_CODE_COMMIT must be supplied by CI as the exact 40-hex Git commit}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    entrypoint: ["/usr/local/bin/backtest-runner"]
    cpus: "4"
    mem_limit: 6g
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: worker
      DB_PASSWORD_FILE: /run/secrets/db_worker_password
      LAGRANGE_REPO_ROOT: /opt/lagrange
      LAGRANGE_DATASET_ROOT: /data
      LAGRANGE_ARTIFACTS_ROOT: /data/artifacts/backtest/runs
      LAGRANGE_UV_BIN: /usr/local/bin/uv
      DATA_CATALOG_DIR: /data/nautilus_catalog
      DATA_CURATED_DIR: /data/curated
      ARTIFACT_RUN_DIR: /data/artifacts/backtest/runs
      BACKTEST_MIN_FREE_BYTES: ${BACKTEST_MIN_FREE_BYTES:?BACKTEST_MIN_FREE_BYTES must be set}
      BACKTEST_MAX_QUEUED_BACKTESTS: ${BACKTEST_MAX_QUEUED_BACKTESTS:?BACKTEST_MAX_QUEUED_BACKTESTS must be set}
      BACKTEST_RECONCILE_GRACE_SECS: ${BACKTEST_RECONCILE_GRACE_SECS:?BACKTEST_RECONCILE_GRACE_SECS must be set}
      BACKTEST_RECONCILE_INTERVAL_SECS: ${BACKTEST_RECONCILE_INTERVAL_SECS:?BACKTEST_RECONCILE_INTERVAL_SECS must be set}
    secrets:
      - source: backtest_2_db_worker_password
        target: db_worker_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ${LAGRANGE_DATA_DIR:-../data}/nautilus_catalog:/data/nautilus_catalog:ro
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}/backtest/runs:/data/artifacts/backtest/runs
    networks:
      - backtest-iso
    healthcheck:
      test: ["CMD", "/usr/local/bin/backtest-runner", "readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # paper-scheduler — scheduled per-user Paper runs. The Rust worker image
  # consumes four role-scoped DB component/password-file boundaries and its
  # healthcheck probes all four pools, the curated dataset root, and the
  # daemon's non-secret loop-progress state.
  # ------------------------------------------------------------------
  paper-scheduler:
    build:
      context: ../..
      dockerfile: deploy/runtime/Dockerfile.paper-runner
    init: true
    restart: unless-stopped
    # The daemon's bounded shutdown contract is 20s; leave systemd/Docker
    # enough time to observe SIGTERM, cancel in-flight stages, and close pools.
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    entrypoint: ["/usr/local/bin/paper-runner"]
    cpus: "1"
    mem_limit: 2g
    environment:
      APP_ENV: ${PAPER_APP_ENV:-production}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      PAPER_APP_DB_USER: app
      PAPER_APP_DB_PASSWORD_FILE: /run/secrets/db_app_password
      PAPER_WORKER_DB_USER: worker
      PAPER_WORKER_DB_PASSWORD_FILE: /run/secrets/db_worker_password
      PAPER_ADMIN_DB_USER: admin
      PAPER_ADMIN_DB_PASSWORD_FILE: /run/secrets/db_admin_password
      PAPER_AUDIT_DB_USER: audit_writer
      PAPER_AUDIT_DB_PASSWORD_FILE: /run/secrets/db_audit_password
      LAGRANGE_REPO_ROOT: /opt/lagrange
      LAGRANGE_DATASET_ROOT: /data
      ARTIFACT_PAPER_DIR: /data/artifacts/paper
      PAPER_HEALTH_STATE_PATH: /tmp/paper-runner-health.json
      PAPER_HEALTH_MAX_AGE_SECS: ${PAPER_HEALTH_MAX_AGE_SECS:-30}
      PAPER_OPERATION_TIMEOUT_MS: ${PAPER_OPERATION_TIMEOUT_MS:-15000}
      PAPER_CYCLE_TIMEOUT_MS: ${PAPER_CYCLE_TIMEOUT_MS:-90000}
      PAPER_SHUTDOWN_GRACE_MS: ${PAPER_SHUTDOWN_GRACE_MS:-20000}
    secrets:
      - source: paper_db_app_password
        target: db_app_password
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: paper_db_worker_password
        target: db_worker_password
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: paper_db_admin_password
        target: db_admin_password
        uid: "10001"
        gid: "10001"
        mode: 0440
      - source: paper_db_audit_password
        target: db_audit_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}:/data:ro
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}/paper:/data/artifacts/paper
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/paper-runner", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      api-server:
        condition: service_healthy

  # ------------------------------------------------------------------
  # No report-worker is declared. The repository has no report job payload,
  # claimant/settlement protocol, or report artifact producer; report views
  # are API read paths over existing backtest/Paper artifacts. Keeping a
  # sleeping container here would falsely report healthy while leaving jobs
  # queued, so deployment is intentionally disabled until that contract is
  # specified and implemented.
  # ------------------------------------------------------------------
  # metrics — Prometheus (optional, `monitoring` profile). Scrapes the
  # api-server /metrics endpoint over the internal backend network.
  # ------------------------------------------------------------------
  metrics:
    image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 # tag: v3.13.2
    profiles: ["monitoring"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:9090"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - ${LAGRANGE_DATA_DIR:-../data}/metrics:/prometheus
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      api-server:
        condition: service_started

  # ------------------------------------------------------------------
  # live-node-owner — Owner-only Live profile. PROFILE-GATED (`live`):
  # inactive by default; activated ONLY with `docker compose --profile live
  # up`. The checked-in image is a deterministic credential-free simulator:
  # it holds the account lock and reconciles continuously, but its trade
  # readiness remains false. It has no broker credentials, database
  # dependency, network attachment, or order-submission path. A future KIS
  # execution loop requires a separately reviewed image and deployment
  # contract; enabling this profile cannot silently provision one.
  # ------------------------------------------------------------------
  live-node-owner:
    build:
      context: ../..
      dockerfile: nt/live-node/Dockerfile
    profiles: ["live"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    entrypoint: ["/usr/local/bin/live-node"]
    cpus: "1"
    mem_limit: 2g
    environment:
      LIVE_NODE_MODE: ${LIVE_NODE_MODE:-disabled}
      LIVE_NODE_DRY_RUN: ${LIVE_NODE_DRY_RUN:-1}
      LIVE_NODE_ACCOUNT_ID: ${LIVE_NODE_ACCOUNT_ID:-disabled}
      LIVE_NODE_RECONCILIATION_INTERVAL_SECONDS: ${LIVE_NODE_RECONCILIATION_INTERVAL_SECONDS:-30}
      LIVE_NODE_KILL_SWITCH: ${LIVE_NODE_KILL_SWITCH:-0}
      LIVE_NODE_RISK_GATE: ${LIVE_NODE_RISK_GATE:-green}
      LIVE_NODE_RECONCILIATION_GATE: ${LIVE_NODE_RECONCILIATION_GATE:-green}
      LIVE_NODE_DATA_FRESH: ${LIVE_NODE_DATA_FRESH:-1}
      LIVE_NODE_GATE_FILE: ${LIVE_NODE_GATE_FILE:-}
    # No network namespace, bind mounts, or Docker secrets are needed by the
    # credential-free simulator.  This prevents accidental egress or secret
    # exposure if an unrelated environment variable is added later.
    network_mode: none
    healthcheck:
      # Liveness is intentionally separate from readiness. `readiness` exits
      # non-zero while disabled/dry-run because no real KIS loop exists.
      test: ["CMD", "/usr/local/bin/live-node", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ----------------------------------------------------------------------
# Secrets. `provision-runtime-secrets.sh` creates service-specific copies under
# the runtime directory with numeric ownership (101 nginx, 999 postgres,
# 10001 application workers, and 999 for non-root database one-shot jobs).
# Compose's long-syntax mode is defense in depth; native Linux bind-backed secrets still
# rely on these host permissions. Values are injected under /run/secrets.
# ----------------------------------------------------------------------
secrets:
  reverse_proxy_tls_cert:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/reverse-proxy/lagrange_tls_cert
  reverse_proxy_tls_key:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/reverse-proxy/lagrange_tls_key
  api_db_app_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/api-server/db_app_password
  api_db_admin_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/api-server/db_admin_password
  api_db_audit_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/api-server/db_audit_password
  api_cursor_secret:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/api-server/cursor_secret
  api_session_secret:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/api-server/session_secret
  api_csrf_secret:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/api-server/csrf_secret
  api_auth0_client_secret:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/api-server/auth0_client_secret
  bootstrap_postgres_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/db-role-bootstrap/postgres_password
  bootstrap_db_migration_owner_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/db-role-bootstrap/db_migration_owner_password
  bootstrap_db_app_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/db-role-bootstrap/db_app_password
  bootstrap_db_worker_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/db-role-bootstrap/db_worker_password
  bootstrap_db_audit_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/db-role-bootstrap/db_audit_password
  bootstrap_db_research_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/db-role-bootstrap/db_research_password
  bootstrap_db_admin_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/db-role-bootstrap/db_admin_password
  migrate_db_migration_owner_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/db-migrate/db_migration_owner_password
  postgres_postgres_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/postgres/postgres_password
  schema_check_postgres_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/research-schema-check/postgres_password
  research_db_research_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/research-worker/db_research_password
  research_krx_api_key:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/research-worker/krx_api_key
  recommendation_db_worker_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/recommendation-runner/db_worker_password
  candidate_db_worker_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/candidate-runner/db_worker_password
  backtest_1_db_worker_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/nt-backtest-worker-1/db_worker_password
  backtest_2_db_worker_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/nt-backtest-worker-2/db_worker_password
  paper_db_app_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/paper-scheduler/db_app_password
  paper_db_worker_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/paper-scheduler/db_worker_password
  paper_db_admin_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/paper-scheduler/db_admin_password
  paper_db_audit_password:
    file: ${LAGRANGE_RUNTIME_SECRET_DIR:-../secrets/runtime}/paper-scheduler/db_audit_password

# ----------------------------------------------------------------------
# Networks (design §13.3).
#   edge        internal:true — reverse-proxy/web/api-server only.
#   backend     has egress — api-server (Auth0), research-worker (KRX),
#               paper-scheduler (queue). The profile-gated live-node-owner
#               uses network_mode:none and has no external dependency.
#   backtest-iso internal:true — nt-backtest-worker-1/2 + postgres ONLY.
#               No default route => no internet for backtest workers.
# ----------------------------------------------------------------------
networks:
  edge:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: false
  backtest-iso:
    driver: bridge
    internal: true

volumes:
  pgdata:
    name: ${LAGRANGE_PGDATA_VOLUME:-lagrange-station-pgdata}

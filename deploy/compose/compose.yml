# Lagrange Station — single-host Compose skeleton (design §13.1 service set).
#
# Security posture (design §13.3, NFR-SEC-001..003):
#   * ONLY port 443 is published to the host (reverse-proxy -> 8443 inside).
#   * Every image is pinned BY DIGEST (no mutable tags anywhere).
#   * PostgreSQL and all workers are reachable only on internal networks;
#     published ports exist on NO other service.
#   * nt-backtest-worker-1/2 are attached ONLY to `backtest-iso`, an
#     `internal: true` network — no default route, no internet egress.
#   * Secrets are Docker secrets mounted at /run/secrets/<name>; no
#     plaintext secret appears in this file or in Git (see ../secrets/).
#   * live-node-owner is gated behind the `live` profile (inactive by
#     default); metrics is gated behind the `monitoring` profile.
#   * Data mounts for shared datasets are read-only; per-run artifact
#     mounts are writable only for the service that produces them.
#
# Service code is added by later todos (8, 22, 27, 33, 36-42); this file
# defines the structure: digest-pinned base images, healthcheck contracts
# (endpoints the real services must serve), networks, secrets, and mounts.
# Placeholder worker healthchecks are replaced by real liveness probes in
# each service's owning todo.

name: lagrange-station

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# Data roots. Bind-mounted relative to this file's directory (deploy/compose).
# Override LAGRANGE_DATA_DIR with an absolute path in production.

services:
  # ------------------------------------------------------------------
  # reverse-proxy — Nginx TLS edge. ONLY published port (443:8443).
  # nginxinc/nginx-unprivileged 1.28-alpine (non-root).
  # ------------------------------------------------------------------
  reverse-proxy:
    image: nginxinc/nginx-unprivileged@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8 # tag: 1.28-alpine
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    logging: *default-logging
    ports:
      # The single host-published port of the whole station.
      - "443:8443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only view of the artifact tree for X-Accel-Redirect delivery
      # (internal /internal-artifacts/ location; never a public path).
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}:/data/artifacts:ro
    secrets:
      - lagrange_tls_cert
      - lagrange_tls_key
    networks:
      - edge
    healthcheck:
      # Container listens on 8080 (plain, internal-only health/redirect) and
      # 8443 (TLS, published as 443). Health never goes over TLS.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api-server:
        condition: service_healthy
      web:
        condition: service_healthy

  # ------------------------------------------------------------------
  # web — Next.js 24 LTS runtime (node:24.13.1-alpine). Auth is handled
  # by api-server (Axum is the confidential OIDC authority); the web shell
  # forwards only the opaque session cookie, so it holds NO secrets.
  # Stub serves GET /healthz on 3000 until Todo 25 lands the real app.
  # ------------------------------------------------------------------
  web:
    image: node@sha256:4f696fbf39f383c1e486030ba6b289a5d9af541642fc78ab197e584a113b9c03 # tag: 24.13.1-alpine
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command: ["node", "-e", "const h=require('http');h.createServer((q,s)=>{s.writeHead(200);s.end('ok')}).listen(3000);setInterval(()=>{},1<<30)"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Same-origin API client target (internal network; never public).
      API_INTERNAL_URL: http://api-server:8080
      # Public base for the login/callback handoff (no secret material).
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api-server:
        condition: service_healthy

  # ------------------------------------------------------------------
  # api-server — Axum REST/OpenAPI authority (Todo 24).
  # Runtime: alpine:3.21. Build stage base rust:1.97.1-alpine
  # (sha256:3c38f3f82c2f3d73da3b38e18d279393a04cb43ddded0e35088a8c3324d40900)
  # is pinned in the multi-stage Dockerfile added by Todo 24.
  # Stub serves GET /healthz on 8080 (busybox httpd) until then.
  # ------------------------------------------------------------------
  api-server:
    image: alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d # tag: 3.21
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command: ["/bin/sh", "-c", "mkdir -p /tmp/www && printf ok > /tmp/www/healthz && exec busybox httpd -f -p 8080 -h /tmp/www"]
    environment:
      APP_PORT: "8080"
      RUST_LOG: ${RUST_LOG:-info}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      SESSION_COOKIE_SECURE: "true"
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET_FILE: /run/secrets/auth0_client_secret
    secrets:
      - db_app_password
      - db_audit_password
      - session_secret
      - csrf_secret
      - auth0_client_secret
    volumes:
      # Read-only artifact tree: the download route hashes files against the
      # result_artifacts manifest before issuing the internal redirect.
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}:/data/artifacts:ro
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # postgres — PostgreSQL 18 (18.4). Internal-only; never published.
  # Password injected from a Docker secret (_FILE variant), never env.
  # ------------------------------------------------------------------
  postgres:
    image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a # tag: 18.4
    init: true
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lagrange}
      POSTGRES_DB: ${POSTGRES_DB:-lagrange}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # DB data on a dedicated named volume (backed up by deploy/backup/).
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data: the
      # PG18 images keep data in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) and the entrypoint refuses to start
      # when it finds a volume on the pre-18 path. Proven by the Todo 33
      # restore drill, which hit exactly this on the same pinned digest.
      - pgdata:/var/lib/postgresql
    networks:
      - backend
      # Also on the isolated backtest network so nt-backtest-worker-* can
      # reach the queue DB without ever touching a network that has egress.
      - backtest-iso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lagrange} -d ${POSTGRES_DB:-lagrange}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------
  # research-raw-init — one-shot ownership fence for the Raw bind root.
  # Root is used only for this chown/chmod; the filesystem root is read-only,
  # the service has no network or secrets, and it cannot restart.
  # ------------------------------------------------------------------
  research-raw-init:
    image: alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d # tag: 3.21
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        find /data/raw -xdev -type d -exec chown 10001:10001 {} +
        find /data/raw -xdev -type d -exec chmod 0750 {} +
        find /data/raw -xdev -type f -exec chown 10001:10001 {} +
        find /data/raw -xdev -type f \( -name manifest.jsonl -o -name commit.lock \) -exec chmod 0640 {} +
        find /data/raw -xdev -type f ! \( -name manifest.jsonl -o -name commit.lock \) -exec chmod 0440 {} +
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/raw:/data/raw

  # ------------------------------------------------------------------
  # research-schema-check — fail-closed migration/role contract gate.
  # This service never migrates. Operators must apply migrations externally;
  # only then can Compose start research-worker.
  # ------------------------------------------------------------------
  research-schema-check:
    image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a # tag: 18.4
    read_only: true
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$(cat "$$DB_PASSWORD_FILE")"
        exec psql -X -v ON_ERROR_STOP=1 -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" -f /opt/lagrange/research-schema-check.sql
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: ${POSTGRES_USER:-lagrange}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: ./research-schema-check.sql
        target: /opt/lagrange/research-schema-check.sql
        read_only: true
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # research-worker — KRX ingestion/curation/catalog (Todo 8-13).
  # The ONLY data-collection worker; it needs internet egress for the
  # licensed KRX source, so it sits on `backend` (not internal).
  # Writes Raw evidence only. Publication metadata is written through the
  # dedicated least-privilege research_writer database role.
  # ------------------------------------------------------------------
  research-worker:
    build:
      context: ../..
      dockerfile: data-pipelines/collectors/Dockerfile
    entrypoint: ["/usr/local/bin/research-worker"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    cpus: "2"
    mem_limit: 4g
    environment:
      # Development/QA defaults to the deterministic fixture. Setting
      # APP_ENV=production while leaving synthetic mode enabled is rejected
      # by the binary before it reads secrets or touches the filesystem.
      APP_ENV: ${APP_ENV:-development}
      RESEARCH_FETCH_MODE: ${RESEARCH_FETCH_MODE:-synthetic}
      RESEARCH_RUN_AT_KST: ${RESEARCH_RUN_AT_KST:-16:30}
      RESEARCH_MAX_PUBLICATION_AGE_SECS: ${RESEARCH_MAX_PUBLICATION_AGE_SECS:-345600}
      RESEARCH_RAW_ROOT: /data
      RESEARCH_SYNTHETIC_BUNDLE: /opt/lagrange/tests/fixtures/kr-etf/contract
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: research_writer
      DB_PASSWORD_FILE: /run/secrets/db_research_password
      KRX_CREDENTIAL_FILE: /run/secrets/krx_api_key
    secrets:
      - db_research_password
      - krx_api_key
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/raw:/data/raw
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/research-worker", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      research-raw-init:
        condition: service_completed_successfully
      research-schema-check:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # recommendation-runner — fixed 11-ETF target generation and opt-in Paper
  # scheduling. It has no broker credentials and reads only curated data plus
  # the immutable universe pin.
  # ------------------------------------------------------------------
  recommendation-runner:
    build:
      context: ../..
      dockerfile: crates/job-queue/Dockerfile
    entrypoint: ["/usr/local/bin/recommendation-runner"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/recommendation-health:uid=10001,gid=10001,mode=0750
    logging: *default-logging
    cpus: "2"
    mem_limit: 4g
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: worker
      DB_PASSWORD_FILE: /run/secrets/db_worker_password
      RECOMMENDATION_HEALTH_STATE_PATH: /run/recommendation-health/health.json
      RECOMMENDATION_HEALTH_MAX_AGE_SECS: "180"
      RECOMMENDATION_DATASET_VERSION_ID: ${RECOMMENDATION_DATASET_VERSION_ID:-}
      RECOMMENDATION_DATASET_ID: ${RECOMMENDATION_DATASET_ID:-krx_eod_bars}
      RECOMMENDATION_DATASET_VERSION: ${RECOMMENDATION_DATASET_VERSION:-}
      RECOMMENDATION_CURATED_VERSION: ${RECOMMENDATION_CURATED_VERSION:-}
      RECOMMENDATION_DATASET_MANIFEST_SHA256: ${RECOMMENDATION_DATASET_MANIFEST_SHA256:-}
    command:
      - --repo-root
      - /opt/lagrange
      - --data-root
      - /data/curated
      - --universe-manifest
      - /opt/lagrange/configs/universes/kr-etf-core-v1.yaml
      - --uv-bin
      - /usr/local/bin/uv
      - --temp-root
      - /tmp
      - --poll-ms
      - "2000"
      - --sweep-ms
      - "30000"
      - --heartbeat-ms
      - "10000"
      - --lease-ms
      - "60000"
      - --backoff-ms
      - "30000"
      - --child-timeout-ms
      - "120000"
    secrets:
      - db_worker_password
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ../../configs/universes/kr-etf-core-v1.yaml:/opt/lagrange/configs/universes/kr-etf-core-v1.yaml:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/recommendation-runner", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # nt-backtest-worker-1 / nt-backtest-worker-2 — NautilusTrader backtests
  # (Todo 20). Design §13.3: NO internet. Attached ONLY to `backtest-iso`
  # (internal: true, no default route). Read-only dataset/catalog mounts;
  # writable per-run artifact mount; DB access via postgres on backtest-iso.
  # ------------------------------------------------------------------
  nt-backtest-worker-1:
    image: python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db # tag: 3.12.10-slim
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command: ["python", "-c", "import time; time.sleep(1e9)"] # placeholder; replaced in Todo 20
    cpus: "4"
    mem_limit: 6g
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: worker
      DB_PASSWORD_FILE: /run/secrets/db_worker_password
      DATA_CATALOG_DIR: /data/nautilus_catalog
      DATA_CURATED_DIR: /data/curated
      ARTIFACT_RUN_DIR: /data/artifacts/backtest/runs
    secrets:
      - db_worker_password
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ${LAGRANGE_DATA_DIR:-../data}/nautilus_catalog:/data/nautilus_catalog:ro
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}/backtest:/data/artifacts/backtest
    networks:
      - backtest-iso
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys'"] # process-alive placeholder (Todo 20)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  nt-backtest-worker-2:
    image: python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db # tag: 3.12.10-slim
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command: ["python", "-c", "import time; time.sleep(1e9)"] # placeholder; replaced in Todo 20
    cpus: "4"
    mem_limit: 6g
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: worker
      DB_PASSWORD_FILE: /run/secrets/db_worker_password
      DATA_CATALOG_DIR: /data/nautilus_catalog
      DATA_CURATED_DIR: /data/curated
      ARTIFACT_RUN_DIR: /data/artifacts/backtest/runs
    secrets:
      - db_worker_password
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ${LAGRANGE_DATA_DIR:-../data}/nautilus_catalog:/data/nautilus_catalog:ro
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}/backtest:/data/artifacts/backtest
    networks:
      - backtest-iso
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys'"] # process-alive placeholder (Todo 20)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # paper-scheduler — scheduled per-user Paper runs (Todo 29-31).
  # ------------------------------------------------------------------
  paper-scheduler:
    image: python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db # tag: 3.12.10-slim
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command: ["python", "-c", "import time; time.sleep(1e9)"] # placeholder; replaced in Todo 29
    cpus: "1"
    mem_limit: 2g
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      ARTIFACT_PAPER_DIR: /data/artifacts/paper
    secrets:
      - db_app_password
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ${LAGRANGE_DATA_DIR:-../data}/nautilus_catalog:/data/nautilus_catalog:ro
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}/paper:/data/artifacts/paper
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys'"] # process-alive placeholder (Todo 29)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_healthy

  # ------------------------------------------------------------------
  # report-worker — performance/report generation (Todo 30-31).
  # ------------------------------------------------------------------
  report-worker:
    image: python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db # tag: 3.12.10-slim
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command: ["python", "-c", "import time; time.sleep(1e9)"] # placeholder; replaced in Todo 30
    cpus: "1"
    mem_limit: 2g
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      ARTIFACT_REPORT_DIR: /data/artifacts/reports
    secrets:
      - db_app_password
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}/reports:/data/artifacts/reports
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys'"] # process-alive placeholder (Todo 30)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_healthy

  # ------------------------------------------------------------------
  # metrics — Prometheus (optional, `monitoring` profile). Scrapes the
  # api-server /metrics endpoint over the internal backend network.
  # ------------------------------------------------------------------
  metrics:
    image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69 # tag: v3.13.2
    profiles: ["monitoring"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:9090"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - ${LAGRANGE_DATA_DIR:-../data}/metrics:/prometheus
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      api-server:
        condition: service_started

  # ------------------------------------------------------------------
  # live-node-owner — Owner-only KIS Live (Phase 3, Todo 36-42).
  # PROFILE-GATED (`live`): inactive by default; activated ONLY with
  # `docker compose --profile live up`. Never part of the default set.
  # Needs egress to KIS, hence `backend`.
  # ------------------------------------------------------------------
  live-node-owner:
    image: python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db # tag: 3.12.10-slim
    profiles: ["live"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    command: ["python", "-c", "import time; time.sleep(1e9)"] # placeholder; replaced in Todo 36
    cpus: "1"
    mem_limit: 2g
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-lagrange}
      DB_USER: app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      KIS_APP_KEY_FILE: /run/secrets/kis_app_key
      KIS_APP_SECRET_FILE: /run/secrets/kis_app_secret
      KIS_ACCOUNT_REF_FILE: /run/secrets/kis_account_ref
      ARTIFACT_LIVE_DIR: /data/artifacts/live
    secrets:
      - db_app_password
      - kis_app_key
      - kis_app_secret
      - kis_account_ref
    volumes:
      - ${LAGRANGE_DATA_DIR:-../data}/curated:/data/curated:ro
      - ${LAGRANGE_DATA_DIR:-../data}/nautilus_catalog:/data/nautilus_catalog:ro
      - ${LAGRANGE_ARTIFACTS_DIR:-../data/artifacts}/live:/data/artifacts/live
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys'"] # process-alive placeholder (Todo 36)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      api-server:
        condition: service_healthy

# ----------------------------------------------------------------------
# Secrets. Each maps to a file under ../secrets/ (see ../secrets/README.md).
# Values are injected at runtime under /run/secrets/<name>; never inline.
# ----------------------------------------------------------------------
secrets:
  postgres_password:
    file: ${LAGRANGE_POSTGRES_PASSWORD_SECRET_SOURCE:-../secrets/postgres_password}
  db_app_password:
    file: ../secrets/db_app_password
  db_worker_password:
    file: ../secrets/db_worker_password
  db_research_password:
    file: ${LAGRANGE_DB_RESEARCH_PASSWORD_SECRET_SOURCE:-../secrets/db_research_password}
  db_audit_password:
    file: ../secrets/db_audit_password
  session_secret:
    file: ../secrets/session_secret
  csrf_secret:
    file: ../secrets/csrf_secret
  auth0_client_secret:
    file: ../secrets/auth0_client_secret
  krx_api_key:
    file: ${LAGRANGE_KRX_API_KEY_SECRET_SOURCE:-../secrets/krx_api_key}
  kis_app_key:
    file: ../secrets/kis_app_key
  kis_app_secret:
    file: ../secrets/kis_app_secret
  kis_account_ref:
    file: ../secrets/kis_account_ref
  lagrange_tls_cert:
    file: ../secrets/tls/lagrange.crt
  lagrange_tls_key:
    file: ../secrets/tls/lagrange.key

# ----------------------------------------------------------------------
# Networks (design §13.3).
#   edge        internal:true — reverse-proxy/web/api-server only.
#   backend     has egress — api-server (Auth0), research-worker (KRX),
#               paper/report (queue), live-node-owner (KIS, profile-gated).
#   backtest-iso internal:true — nt-backtest-worker-1/2 + postgres ONLY.
#               No default route => no internet for backtest workers.
# ----------------------------------------------------------------------
networks:
  edge:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: false
  backtest-iso:
    driver: bridge
    internal: true

volumes:
  pgdata:
    name: ${LAGRANGE_PGDATA_VOLUME:-lagrange-station-pgdata}


global:
  scrape_interval: 60s
  evaluation_interval: 60s

# Backup/restore alerting (Todo 33). The rules fire on the textfile metrics
# that scripts/backup/create.* and restore-and-verify.* write on every run.
rule_files:
  - /etc/prometheus/alerts/*.rules.yml

scrape_configs:
  - job_name: api-server
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api-server:8080"]
        labels:
          service: api-server

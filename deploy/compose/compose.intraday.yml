        "OWNER_INTRADAY_QUOTES_MODE": "${OWNER_INTRADAY_QUOTES_MODE:-off}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "${LAGRANGE_RUNTIME_STATE_DIR:?LAGRANGE_RUNTIME_STATE_DIR must be explicitly set}/kis-read-coordination",
          "target": "/run/lagrange/kis-read-coordination",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ]
    },
